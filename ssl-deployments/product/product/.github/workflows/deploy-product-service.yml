name: Deploy Product Management Service

on:
  push:
    branches: [main, master]
    paths: ['product_management_service/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: bidrsimpleregistry.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Docker image
      run: |
        cd product_management_service
        docker build -t bidrsimpleregistry.azurecr.io/bidr-product-management:latest .
        docker push bidrsimpleregistry.azurecr.io/bidr-product-management:latest

    - name: Deploy to Azure Container Instances
      run: |
        # Get current container details
        CURRENT_FQDN=$(az container show --resource-group bidr-simple-rg --name bidr-product-service --query "ipAddress.fqdn" --output tsv)
        DNS_LABEL=$(echo $CURRENT_FQDN | cut -d'.' -f1)
        
        # Delete old container
        az container delete --resource-group bidr-simple-rg --name bidr-product-service --yes
        
        # Deploy new container
        az container create \
          --resource-group bidr-simple-rg \
          --name bidr-product-service \
          --image bidrsimpleregistry.azurecr.io/bidr-product-management:latest \
          --dns-name-label $DNS_LABEL \
          --ports 8000 \
          --os-type Linux \
          --registry-login-server bidrsimpleregistry.azurecr.io \
          --registry-username ${{ secrets.ACR_USERNAME }} \
          --registry-password ${{ secrets.ACR_PASSWORD }} \
          --environment-variables \
            SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
            DEBUG=False \
            ALLOWED_HOSTS="*" \
          --cpu 1 \
          --memory 1.5 \
          --restart-policy OnFailure

    - name: Verify deployment
      run: |
        # Wait for container to start
        sleep 30
        
        # Get service URL
        FQDN=$(az container show --resource-group bidr-simple-rg --name bidr-product-service --query "ipAddress.fqdn" --output tsv)
        
        # Test health endpoint
        curl -f "http://$FQDN:8000/health/" || exit 1
        
        echo "✅ Service deployed and healthy at: http://$FQDN:8000"
