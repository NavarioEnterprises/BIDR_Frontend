global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: []

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # BIDR Services with correct ports and full DNS names
  - job_name: 'bidr-auth-service'
    static_configs:
      - targets: ['auth-service.bidr-uat.svc.cluster.local:8001']
    metrics_path: /metrics
    scrape_interval: 15s
    relabel_configs:
      - target_label: service
        replacement: auth
      - target_label: app
        replacement: bidr
      - target_label: environment
        replacement: uat

  - job_name: 'bidr-chat-service'
    static_configs:
      - targets: ['chat-service.bidr-uat.svc.cluster.local:8002']
    metrics_path: /metrics
    scrape_interval: 15s
    relabel_configs:
      - target_label: service
        replacement: chat
      - target_label: app
        replacement: bidr
      - target_label: environment
        replacement: uat

  - job_name: 'bidr-payment-service'
