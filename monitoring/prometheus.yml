  - job_name: 'bidr-resolution-service'
    static_configs:
      - targets: ['resolution-service.bidr-uat.svc.cluster.local:8008']
    metrics_path: /metrics
    scrape_interval: 15s
    relabel_configs:
      - target_label: service
        replacement: resolution
      - target_label: app
        replacement: bidr
      - target_label: environment
        replacement: uat

  # Infrastructure Exporters
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 60s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 60s

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 30s
