#cloud-config
package_update: true
package_upgrade: true

packages:
  - nginx
  - curl
  - htop
  - unzip

write_files:
  - content: |
      upstream auth_service {
          server 10.0.223.97:8001 max_fails=3 fail_timeout=30s;
      }

      upstream chat_service {
          server 10.0.240.185:8002 max_fails=3 fail_timeout=30s;
      }

      upstream payment_service {
          server 10.0.131.195:8003 max_fails=3 fail_timeout=30s;
      }

      upstream product_management_service {
          server 10.0.69.33:8004 max_fails=3 fail_timeout=30s;
      }

      upstream notifications_service {
          server 10.0.169.98:8005 max_fails=3 fail_timeout=30s;
      }

      upstream transactions_service {
          server 10.0.131.213:8006 max_fails=3 fail_timeout=30s;
      }

      upstream reviews_service {
          server 10.0.129.186:8007 max_fails=3 fail_timeout=30s;
      }

      upstream resolution_service {
          server 10.0.230.67:8008 max_fails=3 fail_timeout=30s;
      }

      server {
          listen 80 default_server;
          listen [::]:80 default_server;

          server_name _;

          # Health check endpoint
          location /health {
              access_log off;
              return 200 "healthy\n";
              add_header Content-Type text/plain;
          }

          # Auth Service - Routes
          location /api/auth/ {
              proxy_pass http://auth_service/api/auth/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 30s;
              proxy_send_timeout 30s;
              proxy_read_timeout 30s;
          }

          location /auth/ {
              proxy_pass http://auth_service/auth/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 30s;
              proxy_send_timeout 30s;
              proxy_read_timeout 30s;
          }

          # Chat Service - Routes
          location /api/chat/ {
              proxy_pass http://chat_service/api/chat/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 30s;
              proxy_send_timeout 30s;
              proxy_read_timeout 30s;
          }

          # Payment Service - Routes
          location /api/payments/ {
              proxy_pass http://payment_service/api/payments/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 30s;
              proxy_send_timeout 30s;
              proxy_read_timeout 30s;
          }

          # Product Management Service - Routes
          location /api/products/ {
              proxy_pass http://product_management_service/api/products/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 30s;
              proxy_send_timeout 30s;
              proxy_read_timeout 30s;
          }

          # Notifications Service - Routes
          location /api/notifications/ {
              proxy_pass http://notifications_service/api/notifications/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 30s;
              proxy_send_timeout 30s;
              proxy_read_timeout 30s;
          }

          # Transactions Service - Routes
          location /api/transactions/ {
              proxy_pass http://transactions_service/api/transactions/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 30s;
              proxy_send_timeout 30s;
              proxy_read_timeout 30s;
          }

          # Reviews Service - Routes
          location /api/reviews/ {
              proxy_pass http://reviews_service/api/reviews/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 30s;
              proxy_send_timeout 30s;
              proxy_read_timeout 30s;
          }

          # Resolution Service - Routes
          location /api/resolution/ {
              proxy_pass http://resolution_service/api/resolution/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 30s;
              proxy_send_timeout 30s;
              proxy_read_timeout 30s;
          }

          # Default route to auth service (for backward compatibility)
          location / {
              proxy_pass http://auth_service/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 30s;
              proxy_send_timeout 30s;
              proxy_read_timeout 30s;
          }
      }
    path: /etc/nginx/sites-available/bidr-proxy
    permissions: '0644'

runcmd:
  - systemctl enable nginx
  - rm -f /etc/nginx/sites-enabled/default
  - ln -sf /etc/nginx/sites-available/bidr-proxy /etc/nginx/sites-enabled/
  - nginx -t
  - systemctl restart nginx
  - systemctl status nginx

final_message: "BIDR NGINX Proxy setup completed successfully!"
