name: Deploy Infrastructure

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - 'k8s/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - 'k8s/**'

env:
  TF_VERSION: '1.5.0'
  AKS_CLUSTER_NAME: BIDR-dev-aks-cluster
  AKS_RESOURCE_GROUP: bidr-dev-k8s
  NAMESPACE: bidr

jobs:
  detect-infrastructure-changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.changes.outputs.terraform }}
      kubernetes: ${{ steps.changes.outputs.kubernetes }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - uses: dorny/paths-filter@v2
      id: changes
      with:
        filters: |
          terraform:
            - 'terraform/**'
          kubernetes:
            - 'k8s/**'

  terraform-plan:
    needs: detect-infrastructure-changes
    runs-on: ubuntu-latest
    if: needs.detect-infrastructure-changes.outputs.terraform == 'true'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Terraform Format Check
      working-directory: ./terraform
      run: terraform fmt -check -recursive
    
    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init
    
    - name: Terraform Validate
      working-directory: ./terraform
      run: terraform validate
    
    - name: Terraform Plan
      working-directory: ./terraform
      run: |
        terraform plan -out=tfplan
        terraform show -no-color tfplan > tfplan.txt
    
    - name: Upload Terraform Plan
      uses: actions/upload-artifact@v3
      with:
        name: terraform-plan
        path: terraform/tfplan*

  terraform-apply:
    needs: [detect-infrastructure-changes, terraform-plan]
    runs-on: ubuntu-latest
    if: |
      needs.detect-infrastructure-changes.outputs.terraform == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Download Terraform Plan
      uses: actions/download-artifact@v3
      with:
        name: terraform-plan
        path: terraform/
    
    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init
    
    - name: Terraform Apply
      working-directory: ./terraform
      run: terraform apply -auto-approve tfplan

  kubernetes-deploy:
    needs: detect-infrastructure-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-infrastructure-changes.outputs.kubernetes == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Get AKS credentials
      run: |
        az aks get-credentials --resource-group ${{ env.AKS_RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER_NAME }} --overwrite-existing
    
    - name: Validate Kubernetes manifests
      run: |
        # Validate all YAML files
        for file in k8s/*.yaml k8s/*.yml; do
          if [ -f "$file" ]; then
            echo "Validating $file"
            kubectl apply --validate=true --dry-run=client -f "$file"
          fi
        done
    
    - name: Apply Kubernetes manifests
      run: |
        # Apply kustomization if it exists, otherwise apply individual files
        if [ -f "k8s/kustomization.yaml" ]; then
          echo "Applying kustomization..."
          kubectl apply -k k8s/
        else
          echo "Applying individual manifests..."
          kubectl apply -f k8s/
        fi
    
    - name: Wait for deployments to be ready
      run: |
        echo "Waiting for deployments to be ready..."
        kubectl wait --for=condition=available --timeout=300s deployment --all -n ${{ env.NAMESPACE }}
    
    - name: Verify deployment
      run: |
        echo "=== Pods Status ==="
        kubectl get pods -n ${{ env.NAMESPACE }}
        
        echo "=== Services Status ==="
        kubectl get svc -n ${{ env.NAMESPACE }}
        
        echo "=== Ingress/LoadBalancer Status ==="
        kubectl get svc -n ${{ env.NAMESPACE }} -o wide
        
        # Test the main endpoint
        LB_IP=$(kubectl get svc nginx-proxy -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
        if [ -n "$LB_IP" ]; then
          echo "=== Testing main endpoint ==="
          curl -f -m 30 "http://${LB_IP}/health" || echo "Health check failed"
        fi

  notify-infrastructure-success:
    needs: [detect-infrastructure-changes, terraform-apply, kubernetes-deploy]
    runs-on: ubuntu-latest
    if: success()
    steps:
    - name: Infrastructure Success Notification
      run: |
        echo "✅ Infrastructure deployment completed successfully!"
        if [ "${{ needs.detect-infrastructure-changes.outputs.terraform }}" == "true" ]; then
          echo "🏗️ Terraform infrastructure updated"
        fi
        if [ "${{ needs.detect-infrastructure-changes.outputs.kubernetes }}" == "true" ]; then
          echo "☸️ Kubernetes manifests updated"
        fi
        echo "🌐 Access your application at: http://4.221.172.198/"

  notify-infrastructure-failure:
    needs: [detect-infrastructure-changes, terraform-apply, kubernetes-deploy]
    runs-on: ubuntu-latest
    if: failure()
    steps:
    - name: Infrastructure Failure Notification
      run: |
        echo "❌ Infrastructure deployment failed!"
        echo "Please check the logs above for details"
        exit 1
