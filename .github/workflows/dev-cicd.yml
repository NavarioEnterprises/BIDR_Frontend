name: BIDR Dev Branch CI/CD

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

env:
  REGISTRY: bidrnparusdevregistry2024.azurecr.io
  NAMESPACE: bidr
  CLUSTER_NAME: BIDR-dev-aks-cluster
  RESOURCE_GROUP: BIDR-dev-aks-cluster

jobs:
  # Detect which services have changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth-changed: ${{ steps.changes.outputs.auth }}
      chat-changed: ${{ steps.changes.outputs.chat }}
      payment-changed: ${{ steps.changes.outputs.payment }}
      product-changed: ${{ steps.changes.outputs.product }}
      notifications-changed: ${{ steps.changes.outputs.notifications }}
      transactions-changed: ${{ steps.changes.outputs.transactions }}
      reviews-changed: ${{ steps.changes.outputs.reviews }}
      resolution-changed: ${{ steps.changes.outputs.resolution }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            auth:
              - 'authentication_service/**'
            chat:
              - 'chat_service/**'
            payment:
              - 'payment_service/**'
            product:
              - 'product_management_service/**'
            notifications:
              - 'notifications_service/**'
            transactions:
              - 'transactions_service/**'
            reviews:
              - 'reviews_and_ratings/**'
            resolution:
              - 'resolution_service/**'

  # Authentication Service
  build-auth:
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Authentication Service
        uses: docker/build-push-action@v5
        with:
          context: ./authentication_service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/auth-service:latest
            ${{ env.REGISTRY }}/auth-service:dev-${{ github.sha }}

      - name: Deploy Authentication Service
        uses: azure/k8s-deploy@v1
        with:
          manifests: |
            k8s/auth-service.yaml
          images: |
            ${{ env.REGISTRY }}/auth-service:dev-${{ github.sha }}
          namespace: ${{ env.NAMESPACE }}

  # Chat Service
  build-chat:
    needs: detect-changes
    if: needs.detect-changes.outputs.chat-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Chat Service
        uses: docker/build-push-action@v5
        with:
          context: ./chat_service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/chat-service:latest
            ${{ env.REGISTRY }}/chat-service:dev-${{ github.sha }}

      - name: Deploy Chat Service
        uses: azure/k8s-deploy@v1
        with:
          manifests: |
            k8s/chat-service.yaml
          images: |
            ${{ env.REGISTRY }}/chat-service:dev-${{ github.sha }}
          namespace: ${{ env.NAMESPACE }}

  # Payment Service
  build-payment:
    needs: detect-changes
    if: needs.detect-changes.outputs.payment-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Payment Service
        uses: docker/build-push-action@v5
        with:
          context: ./payment_service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/payment-service:latest
            ${{ env.REGISTRY }}/payment-service:dev-${{ github.sha }}

      - name: Deploy Payment Service
        uses: azure/k8s-deploy@v1
        with:
          manifests: |
            k8s/payment-service.yaml
          images: |
            ${{ env.REGISTRY }}/payment-service:dev-${{ github.sha }}
          namespace: ${{ env.NAMESPACE }}

  # Product Service
  build-product:
    needs: detect-changes
    if: needs.detect-changes.outputs.product-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Product Service
        uses: docker/build-push-action@v5
        with:
          context: ./product_management_service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/product-service:latest
            ${{ env.REGISTRY }}/product-service:dev-${{ github.sha }}

      - name: Deploy Product Service
        uses: azure/k8s-deploy@v1
        with:
          manifests: |
            k8s/product-service.yaml
          images: |
            ${{ env.REGISTRY }}/product-service:dev-${{ github.sha }}
          namespace: ${{ env.NAMESPACE }}

  # Notifications Service
  build-notifications:
    needs: detect-changes
    if: needs.detect-changes.outputs.notifications-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Notifications Service
        uses: docker/build-push-action@v5
        with:
          context: ./notifications_service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/notifications-service:latest
            ${{ env.REGISTRY }}/notifications-service:dev-${{ github.sha }}

      - name: Deploy Notifications Service
        uses: azure/k8s-deploy@v1
        with:
          manifests: |
            k8s/notifications-service.yaml
          images: |
            ${{ env.REGISTRY }}/notifications-service:dev-${{ github.sha }}
          namespace: ${{ env.NAMESPACE }}

  # Transactions Service
  build-transactions:
    needs: detect-changes
    if: needs.detect-changes.outputs.transactions-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Transactions Service
        uses: docker/build-push-action@v5
        with:
          context: ./transactions_service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/transactions-service:latest
            ${{ env.REGISTRY }}/transactions-service:dev-${{ github.sha }}

      - name: Deploy Transactions Service
        uses: azure/k8s-deploy@v1
        with:
          manifests: |
            k8s/transactions-service.yaml
          images: |
            ${{ env.REGISTRY }}/transactions-service:dev-${{ github.sha }}
          namespace: ${{ env.NAMESPACE }}

  # Reviews Service
  build-reviews:
    needs: detect-changes
    if: needs.detect-changes.outputs.reviews-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Reviews Service
        uses: docker/build-push-action@v5
        with:
          context: ./reviews_and_ratings
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/reviews-service:latest
            ${{ env.REGISTRY }}/reviews-service:dev-${{ github.sha }}

      - name: Deploy Reviews Service
        uses: azure/k8s-deploy@v1
        with:
          manifests: |
            k8s/reviews-service.yaml
          images: |
            ${{ env.REGISTRY }}/reviews-service:dev-${{ github.sha }}
          namespace: ${{ env.NAMESPACE }}

  # Resolution Service
  build-resolution:
    needs: detect-changes
    if: needs.detect-changes.outputs.resolution-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Resolution Service
        uses: docker/build-push-action@v5
        with:
          context: ./resolution_service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/resolution-service:latest
            ${{ env.REGISTRY }}/resolution-service:dev-${{ github.sha }}

      - name: Deploy Resolution Service
        uses: azure/k8s-deploy@v1
        with:
          manifests: |
            k8s/resolution-service.yaml
          images: |
            ${{ env.REGISTRY }}/resolution-service:dev-${{ github.sha }}
          namespace: ${{ env.NAMESPACE }}

  # Notification job to report deployment status
  deployment-status:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-auth, build-chat, build-payment, build-product, build-notifications, build-transactions, build-reviews, build-resolution]
    if: always()
    steps:
      - name: Report deployment status
        run: |
          echo "🚀 BIDR Dev Deployment Summary"
          echo "==============================="
          echo "Changed Services:"
          echo "- Auth: ${{ needs.detect-changes.outputs.auth-changed }}"
          echo "- Chat: ${{ needs.detect-changes.outputs.chat-changed }}"
          echo "- Payment: ${{ needs.detect-changes.outputs.payment-changed }}"
          echo "- Product: ${{ needs.detect-changes.outputs.product-changed }}"
          echo "- Notifications: ${{ needs.detect-changes.outputs.notifications-changed }}"
          echo "- Transactions: ${{ needs.detect-changes.outputs.transactions-changed }}"
          echo "- Reviews: ${{ needs.detect-changes.outputs.reviews-changed }}"
          echo "- Resolution: ${{ needs.detect-changes.outputs.resolution-changed }}"
          echo "==============================="
          echo "✅ Deployment completed for dev branch"
