version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: bidr_unified_db
      POSTGRES_USER: bidr_user
      POSTGRES_PASSWORD: bidr_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Redis for caching and real-time features
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # BIDR API Service
  bidr-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://bidr_user:bidr_password@postgres:5432/bidr_unified_db
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-super-secret-key-change-in-production
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  # Flutter Web Builder
  flutter-builder:
    image: cirrusci/flutter:stable
    working_dir: /app
    volumes:
      - ./flutter_app:/app
    command: >
      sh -c "flutter config --enable-web &&
             flutter pub get &&
             flutter build web --release"
    profiles:
      - build

  # Nginx for serving Flutter web and reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./flutter_app/build/web:/usr/share/nginx/html
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - bidr-api
    restart: unless-stopped

volumes:
  postgres_data: