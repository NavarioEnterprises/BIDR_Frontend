apiVersion: apps/v1
kind: Deployment
metadata:
  name: bidr-product-management
  labels:
    app: bidr-product-management
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bidr-product-management
  template:
    metadata:
      labels:
        app: bidr-product-management
    spec:
      containers:
      - name: bidr-product-management
        image: bidrregistry.azurecr.io/bidr-product-management:latest
        ports:
        - containerPort: 8000
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: "product_management_service.settings"
        - name: DEBUG
          value: "False"
        - name: ALLOWED_HOSTS
          value: "*"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: django-secrets
              key: secret-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bidr-product-management-service
  labels:
    app: bidr-product-management
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
  selector:
    app: bidr-product-management
---
apiVersion: v1
kind: Secret
metadata:
  name: django-secrets
type: Opaque
data:
  # Base64 encoded secret key (change this!)
  secret-key: eW91ci1zZWNyZXQta2V5LWhlcmUtY2hhbmdlLW1l
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bidr-product-management-ingress
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: bidr-api.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bidr-product-management-service
            port:
              number: 80
