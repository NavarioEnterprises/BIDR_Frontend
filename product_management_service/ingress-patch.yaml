spec:
  rules:
  - host: bidr.local
    http:
      paths:
      # API endpoints
      - backend:
          service:
            name: auth-service
            port:
              number: 8000
        path: /api/v1/auth/(.*)
        pathType: Prefix
      - backend:
          service:
            name: chat-service
            port:
              number: 8000
        path: /api/v1/chat/(.*)
        pathType: Prefix
      - backend:
          service:
            name: payment-service
            port:
              number: 8000
        path: /api/v1/payment/(.*)
        pathType: Prefix
      - backend:
          service:
            name: resolution-service
            port:
              number: 8000
        path: /api/v1/resolution/(.*)
        pathType: Prefix
      - backend:
          service:
            name: product-management-service
            port:
              number: 8000
        path: /api/v1/products/(.*)
        pathType: Prefix
      - backend:
          service:
            name: notifications-service
            port:
              number: 8000
        path: /api/v1/notifications/(.*)
        pathType: Prefix
      - backend:
          service:
            name: transactions-service
            port:
              number: 8000
        path: /api/v1/transactions/(.*)
        pathType: Prefix
      - backend:
          service:
            name: reviews-service
            port:
              number: 8000
        path: /api/v1/reviews/(.*)
        pathType: Prefix
      
      # Product Management Service - NO REWRITE, preserve /products prefix
      - backend:
          service:
            name: product-management-service
            port:
              number: 8000
        path: /products
        pathType: Prefix
      
      # Admin endpoints for specific services
      - backend:
          service:
            name: auth-service
            port:
              number: 8000
        path: /admin/auth/(.*)
        pathType: Prefix
      - backend:
          service:
            name: chat-service
            port:
              number: 8000
        path: /admin/chat/(.*)
        pathType: Prefix
      - backend:
          service:
            name: payment-service
            port:
              number: 8000
        path: /admin/payment/(.*)
        pathType: Prefix
      - backend:
          service:
            name: resolution-service
            port:
              number: 8000
        path: /admin/resolution/(.*)
        pathType: Prefix
      - backend:
          service:
            name: product-management-service
            port:
              number: 8000
        path: /admin/products/(.*)
        pathType: Prefix
      - backend:
          service:
            name: notifications-service
            port:
              number: 8000
        path: /admin/notifications/(.*)
        pathType: Prefix
      - backend:
          service:
            name: transactions-service
            port:
              number: 8000
        path: /admin/transactions/(.*)
        pathType: Prefix
      - backend:
          service:
            name: reviews-service
            port:
              number: 8000
        path: /admin/reviews/(.*)
        pathType: Prefix
      
      # Health checks
      - backend:
          service:
            name: auth-service
            port:
              number: 8000
        path: /health/(.*)
        pathType: Prefix
      
      # Catch-all for auth service (MUST be last)
      - backend:
          service:
            name: auth-service
            port:
              number: 8000
        path: /(.*)
        pathType: Prefix
