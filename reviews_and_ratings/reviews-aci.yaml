        value: "False"
      - name: ALLOWED_HOSTS
        value: "*"
      resources:
        requests:
          cpu: 1.0
          memoryInGb: 1.5
  imageRegistryCredentials:
  - server: bidrsimpleregistry.azurecr.io
    username: bidrsimpleregistry
    password: +qf30mZYMhdhNjMp+/AdcFTIImZxzzVuxQVNQssIKa+ACRDr3Esz
  ipAddress:
    type: Public
    ports:
    - port: 8000
      protocol: tcp
  osType: Linux
tags: {}
