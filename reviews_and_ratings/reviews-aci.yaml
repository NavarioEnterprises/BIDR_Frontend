apiVersion: 2019-12-01
location: eastus
name: bidr-reviews-service
properties:
  containers:
  - name: bidr-reviews-service
    properties:
      image: bidrsimpleregistry.azurecr.io/bidr-reviews-service:v7-fixed-migration
      ports:
      - port: 8000
        protocol: tcp
      environmentVariables:
      - name: DJANGO_SETTINGS_MODULE
        value: reviews_and_ratings.settings
