apiVersion: v1
kind: Service
metadata:
  name: grafana-external
  namespace: bidr-uat
  labels:
    app: grafana
    service: grafana-external
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
  loadBalancerSourceRanges:
    - 0.0.0.0/0
