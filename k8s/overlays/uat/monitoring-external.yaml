apiVersion: v1
kind: Service
metadata:
  name: monitoring-external
  namespace: bidr-uat
  labels:
    service: monitoring-external
spec:
  type: LoadBalancer
  ports:
    # Grafana on port 3000
    - name: grafana
      protocol: TCP
      port: 3000
      targetPort: 3000
    # Prometheus on port 4000 (mapped to internal 9090)
    - name: prometheus
      protocol: TCP
      port: 4000
      targetPort: 9090
  # This service will route to both Grafana and Prometheus pods
  # We'll use a selector that doesn't match any specific pod
  # and create endpoints manually
  selector: {}
  loadBalancerSourceRanges:
    - 0.0.0.0/0
---
# Manual endpoints to route traffic correctly
apiVersion: v1
kind: Endpoints
metadata:
  name: monitoring-external
  namespace: bidr-uat
subsets:
  - addresses:
      # Grafana pod IP (updated)
      - ip: 10.244.1.157
    ports:
      - name: grafana
        port: 3000
        protocol: TCP
  - addresses:
      # Prometheus pod IP  
      - ip: 10.244.1.211
    ports:
      - name: prometheus
        port: 9090
        protocol: TCP
