apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: bidr
  labels:
    app: payment-service
    service: payment
    version: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        service: payment
        version: dev
    spec:
      serviceAccountName: bidr-service-account
      containers:
      - name: payment-service
        image: python:3.11-slim
        ports:
        - containerPort: 8000
        env:
        - name: DEBUG
          value: "True"
        - name: DJANGO_SETTINGS_MODULE
          value: "payment_service.settings"
        - name: SECRET_KEY
          value: "django-secret-key-for-payment-service-uat-environment-2024"
        - name: ALLOWED_HOSTS
          value: "*"
        command:
        - /bin/bash
        - -c
        - |
          # Install required packages
          pip install --no-cache-dir \
            Django==5.2.5 \
            djangorestframework==3.16.1 \
            django-cors-headers==4.7.0 \
            django-filter==25.1 \
            drf-yasg==1.21.10 \
            Pillow==11.3.0 \
            django-prometheus==2.4.1 \
            django-extensions==4.1 \
            whitenoise==6.9.0 \
            stripe==7.7.0 \
            paypalcheckoutsdk==1.0.1 \
            cryptography==41.0.8 \
            requests==2.31.0 \
            celery==5.3.4 \
            redis==5.0.0
          
          # Create app directory and copy source
          mkdir -p /app/payment_service
          cd /app/payment_service
          
          # Create manage.py
          cat > manage.py << 'EOF'
          #!/usr/bin/env python
          import os
          import sys
          
          if __name__ == '__main__':
              os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'payment_service.settings')
              try:
                  from django.core.management import execute_from_command_line
              except ImportError as exc:
                  raise ImportError(
                      "Couldn't import Django. Are you sure it's installed and "
                      "available on your PYTHONPATH environment variable? Did you "
                      "forget to activate a virtual environment?"
                  ) from exc
              execute_from_command_line(sys.argv)
          EOF
          
          # Create minimal Django project structure
          mkdir -p payment_service
          cd payment_service
          
          # Create __init__.py
          touch __init__.py
          
          # Create settings.py with your actual configuration
          cat > settings.py << 'EOF'
          import os
          from pathlib import Path
          
          BASE_DIR = Path(__file__).resolve().parent.parent
          
          SECRET_KEY = os.getenv('SECRET_KEY', 'django-secret-key-for-payment-service-uat-environment-2024')
          
          DEBUG = os.getenv('DEBUG', 'True').lower() == 'true'
          
          ALLOWED_HOSTS = ['*']
          
          INSTALLED_APPS = [
              'django.contrib.admin',
              'django.contrib.auth',
              'django.contrib.contenttypes',
              'django.contrib.sessions',
              'django.contrib.messages',
              'django.contrib.staticfiles',
              'rest_framework',
              'corsheaders',
              'django_filters',
              'drf_yasg',
              'django_prometheus',
              'django_extensions',
              'payments',
              'stripe_integration',
              'paypal_integration',
              'billing',
              'transactions',
          ]
          
          MIDDLEWARE = [
              'corsheaders.middleware.CorsMiddleware',
              'django.middleware.security.SecurityMiddleware',
              'whitenoise.middleware.WhiteNoiseMiddleware',
              'django.contrib.sessions.middleware.SessionMiddleware',
              'django.middleware.common.CommonMiddleware',
              'django.middleware.csrf.CsrfViewMiddleware',
              'django.contrib.auth.middleware.AuthenticationMiddleware',
              'django.contrib.messages.middleware.MessageMiddleware',
              'django.middleware.clickjacking.XFrameOptionsMiddleware',
              'django_prometheus.middleware.PrometheusBeforeMiddleware',
              'django_prometheus.middleware.PrometheusAfterMiddleware',
          ]
          
          ROOT_URLCONF = 'payment_service.urls'
          
          TEMPLATES = [
              {
                  'BACKEND': 'django.template.backends.django.DjangoTemplates',
                  'DIRS': [BASE_DIR / 'templates'],
                  'APP_DIRS': True,
                  'OPTIONS': {
                      'context_processors': [
                          'django.template.context_processors.debug',
                          'django.template.context_processors.request',
                          'django.contrib.auth.context_processors.auth',
                          'django.contrib.messages.context_processors.messages',
                      ],
                  },
              },
          ]
          
          WSGI_APPLICATION = 'payment_service.wsgi.application'
          
          DATABASES = {
              'default': {
                  'ENGINE': 'django.db.backends.sqlite3',
                  'NAME': BASE_DIR / 'db.sqlite3',
              }
          }
          
          # Stripe Configuration
          STRIPE_PUBLISHABLE_KEY = os.getenv('STRIPE_PUBLISHABLE_KEY', 'pk_test_your_stripe_publishable_key')
          STRIPE_SECRET_KEY = os.getenv('STRIPE_SECRET_KEY', 'sk_test_your_stripe_secret_key')
          STRIPE_WEBHOOK_SECRET = os.getenv('STRIPE_WEBHOOK_SECRET', 'whsec_your_webhook_secret')
          
          # PayPal Configuration
          PAYPAL_CLIENT_ID = os.getenv('PAYPAL_CLIENT_ID', 'your_paypal_client_id')
          PAYPAL_CLIENT_SECRET = os.getenv('PAYPAL_CLIENT_SECRET', 'your_paypal_client_secret')
          PAYPAL_SANDBOX_MODE = os.getenv('PAYPAL_SANDBOX_MODE', 'True').lower() == 'true'
          
          # Celery Configuration for async payment processing
          CELERY_BROKER_URL = 'redis://localhost:6379/0'
          CELERY_RESULT_BACKEND = 'redis://localhost:6379/0'
          CELERY_ACCEPT_CONTENT = ['json']
          CELERY_TASK_SERIALIZER = 'json'
          CELERY_RESULT_SERIALIZER = 'json'
          CELERY_TIMEZONE = 'UTC'
          
          # Security Settings
          SECURE_PAYMENT_DATA_ENCRYPTION_KEY = os.getenv('PAYMENT_ENCRYPTION_KEY', 'your-32-char-encryption-key-here')
          
          AUTH_PASSWORD_VALIDATORS = [
              {
                  'NAME': 'django.contrib.auth.password_validation.UserAttributeSimilarityValidator',
              },
              {
                  'NAME': 'django.contrib.auth.password_validation.MinimumLengthValidator',
              },
              {
                  'NAME': 'django.contrib.auth.password_validation.CommonPasswordValidator',
              },
              {
                  'NAME': 'django.contrib.auth.password_validation.NumericPasswordValidator',
              },
          ]
          
          LANGUAGE_CODE = 'en-us'
          TIME_ZONE = 'UTC'
          USE_I18N = True
          USE_TZ = True
          
          DEFAULT_AUTO_FIELD = 'django.db.models.BigAutoField'
          
          # REST Framework Configuration
          REST_FRAMEWORK = {
              'DEFAULT_PERMISSION_CLASSES': [
                  'rest_framework.permissions.AllowAny',
              ],
              'DEFAULT_PAGINATION_CLASS': 'rest_framework.pagination.PageNumberPagination',
              'PAGE_SIZE': 20,
              'DEFAULT_RENDERER_CLASSES': [
                  'rest_framework.renderers.JSONRenderer',
                  'rest_framework.renderers.BrowsableAPIRenderer',
              ],
          }
          
          # CORS Configuration
          CORS_ALLOW_ALL_ORIGINS = True
          CORS_ALLOW_CREDENTIALS = True
          
          # URL Prefix Configuration for Reverse Proxy
          FORCE_SCRIPT_NAME = '/payments'
          USE_X_FORWARDED_HOST = True
          SECURE_PROXY_SSL_HEADER = ('HTTP_X_FORWARDED_PROTO', 'https')
          
          # Static files configuration with prefix
          STATIC_URL = '/payments/static/'
          STATIC_ROOT = BASE_DIR / 'staticfiles'
          
          # Logging Configuration
          LOGGING = {
              'version': 1,
              'disable_existing_loggers': False,
              'handlers': {
                  'file': {
                      'level': 'INFO',
                      'class': 'logging.FileHandler',
                      'filename': 'payment_service.log',
                  },
              },
              'loggers': {
                  'payments': {
                      'handlers': ['file'],
                      'level': 'INFO',
                      'propagate': True,
                  },
              },
          }
          EOF
          
          # Create urls.py
          cat > urls.py << 'EOF'
          from django.contrib import admin
          from django.urls import path, include
          from django.http import JsonResponse, HttpResponse
          from rest_framework import permissions
          from drf_yasg.views import get_schema_view
          from drf_yasg import openapi
          from django_prometheus.exports import ExportToDjangoView
          
          # API documentation schema
          schema_view = get_schema_view(
              openapi.Info(
                  title="BIDR Payment Service API",
                  default_version='v1',
                  description="Secure Payment Processing System with Stripe and PayPal Integration",
                  terms_of_service="https://www.bidr.com/terms/",
                  contact=openapi.Contact(email="contact@bidr.com"),
                  license=openapi.License(name="BSD License"),
              ),
              public=True,
              permission_classes=(permissions.AllowAny,),
          )
          
          def health_check(request):
              return JsonResponse({
                  'status': 'healthy',
                  'service': 'payment-service',
                  'version': '1.0.0',
                  'message': 'Secure payment processing service',
                  'features': ['Stripe integration', 'PayPal integration', 'Secure transactions', 'Billing management']
              })
          
          def home_view(request):
              return HttpResponse('''
          <!DOCTYPE html>
          <html>
          <head>
              <title>BIDR Payment Service</title>
              <style>
                  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
                  .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
                  .header { background: rgba(255,255,255,0.95); border-radius: 15px; padding: 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 30px; }
                  .title { color: #2c3e50; font-size: 3em; margin: 0; font-weight: 300; }
                  .subtitle { color: #7f8c8d; font-size: 1.2em; margin: 10px 0; }
                  .badge { background: #27ae60; color: white; padding: 8px 16px; border-radius: 20px; font-size: 0.9em; display: inline-block; }
                  .security-badge { background: #e74c3c; color: white; padding: 8px 16px; border-radius: 20px; font-size: 0.9em; display: inline-block; margin-left: 10px; }
                  .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin: 30px 0; }
                  .nav-card { background: rgba(255,255,255,0.9); border-radius: 12px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); transition: transform 0.3s ease; }
                  .nav-card:hover { transform: translateY(-5px); }
                  .nav-card h3 { color: #2c3e50; margin-top: 0; font-size: 1.5em; }
                  .nav-link { display: block; background: #3498db; color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; text-align: center; margin: 10px 0; transition: background 0.3s; }
                  .nav-link:hover { background: #2980b9; }
                  .nav-link.admin { background: #e74c3c; }
                  .nav-link.admin:hover { background: #c0392b; }
                  .nav-link.api { background: #9b59b6; }
                  .nav-link.api:hover { background: #8e44ad; }
                  .features { display: flex; flex-wrap: wrap; gap: 15px; margin: 20px 0; }
                  .feature { background: rgba(46, 204, 113, 0.1); color: #27ae60; padding: 8px 16px; border-radius: 20px; font-size: 0.9em; }
                  .security-features { display: flex; flex-wrap: wrap; gap: 15px; margin: 20px 0; }
                  .security-feature { background: rgba(231, 76, 60, 0.1); color: #e74c3c; padding: 8px 16px; border-radius: 20px; font-size: 0.9em; }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h1 class="title">💳 BIDR Payment Service</h1>
                      <p class="subtitle">Secure Payment Processing System</p>
                      <span class="badge">✅ RUNNING LIVE</span>
                      <span class="security-badge">🔒 PCI COMPLIANT</span>
                  </div>
                  
                  <div class="nav-grid">
                      <div class="nav-card">
                          <h3>🛠️ Administration</h3>
                          <p>Manage payments, transactions, and billing</p>
                          <a href="/admin/" class="nav-link admin">Django Admin Panel</a>
                          <a href="/admin/payments/" class="nav-link admin">Payment Management</a>
                      </div>
                      
                      <div class="nav-card">
                          <h3>📊 API Documentation</h3>
                          <p>Interactive API documentation and testing interface</p>
                          <a href="/swagger/" class="nav-link api">Swagger UI</a>
                          <a href="/redoc/" class="nav-link api">ReDoc</a>
                          <a href="/swagger.json" class="nav-link api">OpenAPI Spec</a>
                      </div>
                      
                      <div class="nav-card">
                          <h3>🔧 System Health</h3>
                          <p>Monitor system status and performance metrics</p>
                          <a href="/health/" class="nav-link">Health Check</a>
                          <a href="/metrics" class="nav-link">Prometheus Metrics</a>
                      </div>
                  </div>
                  
                  <div class="nav-card">
                      <h3>🚀 Features</h3>
                      <div class="features">
                          <span class="feature">Django 5.2.5</span>
                          <span class="feature">Stripe Integration</span>
                          <span class="feature">PayPal Integration</span>
                          <span class="feature">Secure Transactions</span>
                          <span class="feature">Billing Management</span>
                          <span class="feature">Webhook Support</span>
                          <span class="feature">REST API</span>
                          <span class="feature">CORS Enabled</span>
                      </div>
                      
                      <h3>🔒 Security Features</h3>
                      <div class="security-features">
                          <span class="security-feature">Data Encryption</span>
                          <span class="security-feature">PCI DSS Compliance</span>
                          <span class="security-feature">Secure Webhooks</span>
                          <span class="security-feature">Transaction Logging</span>
                          <span class="security-feature">Fraud Prevention</span>
                      </div>
                  </div>
              </div>
          </body>
          </html>
              ''')
          
          urlpatterns = [
              # Admin interface
              path('admin/', admin.site.urls),
              
              # Health check
              path('health/', health_check, name='health-check'),
              path('metrics', ExportToDjangoView, name='prometheus-django-metrics'),
              
              # API documentation
              path('', home_view, name='home'),
              path('swagger/', schema_view.with_ui('swagger', cache_timeout=0), name='schema-swagger-ui'),
              path('redoc/', schema_view.with_ui('redoc', cache_timeout=0), name='schema-redoc'),
              path('swagger.json', schema_view.without_ui(cache_timeout=0), name='schema-json'),
              
              # App URLs
              path('api/payments/', include('payments.urls')),
              path('api/stripe/', include('stripe_integration.urls')),
              path('api/paypal/', include('paypal_integration.urls')),
              path('api/billing/', include('billing.urls')),
              path('api/transactions/', include('transactions.urls')),
          ]
          EOF
          
          # Create wsgi.py
          cat > wsgi.py << 'EOF'
          import os
          from django.core.wsgi import get_wsgi_application
          
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'payment_service.settings')
          
          application = get_wsgi_application()
          EOF
          
          # Go back to project root
          cd /app/payment_service
          
          # Create Django apps structure
          # Payments app
          mkdir -p payments
          cd payments
          touch __init__.py
          cat > models.py << 'APPEOF'
          from django.db import models
          from django.contrib.auth.models import User
          from decimal import Decimal
          import uuid
          
          class BaseModel(models.Model):
              created_at = models.DateTimeField(auto_now_add=True)
              updated_at = models.DateTimeField(auto_now=True)
              
              class Meta:
                  abstract = True
          
          class PaymentStatus(models.TextChoices):
              PENDING = 'pending', 'Pending'
              PROCESSING = 'processing', 'Processing'
              COMPLETED = 'completed', 'Completed'
              FAILED = 'failed', 'Failed'
              REFUNDED = 'refunded', 'Refunded'
              CANCELLED = 'cancelled', 'Cancelled'
          
          class PaymentMethod(models.TextChoices):
              STRIPE = 'stripe', 'Stripe'
              PAYPAL = 'paypal', 'PayPal'
              BANK_TRANSFER = 'bank_transfer', 'Bank Transfer'
          
          class Payment(BaseModel):
              id = models.UUIDField(primary_key=True, default=uuid.uuid4, editable=False)
              user = models.ForeignKey(User, on_delete=models.CASCADE)
              amount = models.DecimalField(max_digits=10, decimal_places=2)
              currency = models.CharField(max_length=3, default='USD')
              payment_method = models.CharField(max_length=50, choices=PaymentMethod.choices)
              status = models.CharField(max_length=50, choices=PaymentStatus.choices, default=PaymentStatus.PENDING)
              external_payment_id = models.CharField(max_length=255, blank=True)
              description = models.TextField(blank=True)
              metadata = models.JSONField(default=dict, blank=True)
              
              class Meta:
                  ordering = ['-created_at']
          
              def __str__(self):
                  return f"Payment {self.id} - {self.amount} {self.currency}"
          
          class Transaction(BaseModel):
              payment = models.ForeignKey(Payment, on_delete=models.CASCADE, related_name='transactions')
              transaction_type = models.CharField(max_length=50)
              amount = models.DecimalField(max_digits=10, decimal_places=2)
              status = models.CharField(max_length=50)
              external_transaction_id = models.CharField(max_length=255, blank=True)
              notes = models.TextField(blank=True)
              
              def __str__(self):
                  return f"Transaction {self.id} - {self.transaction_type}"
          APPEOF
          
          cat > admin.py << 'APPEOF'
          from django.contrib import admin
          from .models import Payment, Transaction
          
          @admin.register(Payment)
          class PaymentAdmin(admin.ModelAdmin):
              list_display = ['id', 'user', 'amount', 'currency', 'payment_method', 'status', 'created_at']
              list_filter = ['payment_method', 'status', 'currency', 'created_at']
              search_fields = ['user__username', 'external_payment_id', 'description']
              readonly_fields = ['id', 'created_at', 'updated_at']
          
          @admin.register(Transaction)
          class TransactionAdmin(admin.ModelAdmin):
              list_display = ['id', 'payment', 'transaction_type', 'amount', 'status', 'created_at']
              list_filter = ['transaction_type', 'status', 'created_at']
              search_fields = ['payment__id', 'external_transaction_id']
          APPEOF
          
          cat > apps.py << 'APPEOF'
          from django.apps import AppConfig
          
          class PaymentsConfig(AppConfig):
              default_auto_field = 'django.db.models.BigAutoField'
              name = 'payments'
          APPEOF
          
          cat > urls.py << 'APPEOF'
          from django.urls import path
          from django.http import JsonResponse
          
          def payments_placeholder(request):
              return JsonResponse({
                  'message': 'Payment service is running', 
                  'status': 'active',
                  'features': ['Stripe payments', 'PayPal payments', 'Secure transactions', 'Billing management']
              })
          
          urlpatterns = [
              path('', payments_placeholder, name='payments-placeholder'),
          ]
          APPEOF
          
          cd ..
          
          # Stripe integration app
          mkdir -p stripe_integration
          cd stripe_integration
          touch __init__.py
          cat > models.py << 'APPEOF'
          from django.db import models
          from payments.models import Payment
          
          class BaseModel(models.Model):
              created_at = models.DateTimeField(auto_now_add=True)
              updated_at = models.DateTimeField(auto_now=True)
              
              class Meta:
                  abstract = True
          
          class StripeCustomer(BaseModel):
              user = models.OneToOneField('auth.User', on_delete=models.CASCADE)
              stripe_customer_id = models.CharField(max_length=255, unique=True)
              
              def __str__(self):
                  return f"Stripe Customer: {self.user.username}"
          
          class StripePaymentIntent(BaseModel):
              payment = models.OneToOneField(Payment, on_delete=models.CASCADE)
              stripe_payment_intent_id = models.CharField(max_length=255, unique=True)
              client_secret = models.CharField(max_length=255)
              
              def __str__(self):
                  return f"Stripe PI: {self.stripe_payment_intent_id}"
          APPEOF
          
          cat > admin.py << 'APPEOF'
          from django.contrib import admin
          from .models import StripeCustomer, StripePaymentIntent
          
          @admin.register(StripeCustomer)
          class StripeCustomerAdmin(admin.ModelAdmin):
              list_display = ['user', 'stripe_customer_id', 'created_at']
              search_fields = ['user__username', 'stripe_customer_id']
          
          @admin.register(StripePaymentIntent)
          class StripePaymentIntentAdmin(admin.ModelAdmin):
              list_display = ['payment', 'stripe_payment_intent_id', 'created_at']
              search_fields = ['stripe_payment_intent_id', 'payment__id']
          APPEOF
          
          cat > apps.py << 'APPEOF'
          from django.apps import AppConfig
          
          class StripeIntegrationConfig(AppConfig):
              default_auto_field = 'django.db.models.BigAutoField'
              name = 'stripe_integration'
          APPEOF
          
          cat > urls.py << 'APPEOF'
          from django.urls import path
          from django.http import JsonResponse
          
          def stripe_placeholder(request):
              return JsonResponse({
                  'message': 'Stripe integration service is running', 
                  'status': 'active'
              })
          
          urlpatterns = [
              path('', stripe_placeholder, name='stripe-placeholder'),
          ]
          APPEOF
          
          cd ..
          
          # PayPal integration app
          mkdir -p paypal_integration
          cd paypal_integration
          touch __init__.py
          cat > models.py << 'APPEOF'
          from django.db import models
          from payments.models import Payment
          
          class BaseModel(models.Model):
              created_at = models.DateTimeField(auto_now_add=True)
              updated_at = models.DateTimeField(auto_now=True)
              
              class Meta:
                  abstract = True
          
          class PayPalOrder(BaseModel):
              payment = models.OneToOneField(Payment, on_delete=models.CASCADE)
              paypal_order_id = models.CharField(max_length=255, unique=True)
              approval_url = models.URLField(blank=True)
              
              def __str__(self):
                  return f"PayPal Order: {self.paypal_order_id}"
          APPEOF
          
          cat > admin.py << 'APPEOF'
          from django.contrib import admin
          from .models import PayPalOrder
          
          @admin.register(PayPalOrder)
          class PayPalOrderAdmin(admin.ModelAdmin):
              list_display = ['payment', 'paypal_order_id', 'created_at']
              search_fields = ['paypal_order_id', 'payment__id']
          APPEOF
          
          cat > apps.py << 'APPEOF'
          from django.apps import AppConfig
          
          class PaypalIntegrationConfig(AppConfig):
              default_auto_field = 'django.db.models.BigAutoField'
              name = 'paypal_integration'
          APPEOF
          
          cat > urls.py << 'APPEOF'
          from django.urls import path
          from django.http import JsonResponse
          
          def paypal_placeholder(request):
              return JsonResponse({
                  'message': 'PayPal integration service is running', 
                  'status': 'active'
              })
          
          urlpatterns = [
              path('', paypal_placeholder, name='paypal-placeholder'),
          ]
          APPEOF
          
          cd ..
          
          # Billing app
          mkdir -p billing
          cd billing
          touch __init__.py
          cat > models.py << 'APPEOF'
          from django.db import models
          from django.contrib.auth.models import User
          from decimal import Decimal
          
          class BaseModel(models.Model):
              created_at = models.DateTimeField(auto_now_add=True)
              updated_at = models.DateTimeField(auto_now=True)
              
              class Meta:
                  abstract = True
          
          class BillingAddress(BaseModel):
              user = models.ForeignKey(User, on_delete=models.CASCADE)
              street_address = models.CharField(max_length=255)
              city = models.CharField(max_length=100)
              state = models.CharField(max_length=100)
              postal_code = models.CharField(max_length=20)
              country = models.CharField(max_length=100)
              is_default = models.BooleanField(default=False)
              
              def __str__(self):
                  return f"{self.user.username} - {self.city}, {self.country}"
          
          class Invoice(BaseModel):
              user = models.ForeignKey(User, on_delete=models.CASCADE)
              invoice_number = models.CharField(max_length=50, unique=True)
              total_amount = models.DecimalField(max_digits=10, decimal_places=2)
              currency = models.CharField(max_length=3, default='USD')
              is_paid = models.BooleanField(default=False)
              due_date = models.DateField()
              
              def __str__(self):
                  return f"Invoice {self.invoice_number}"
          APPEOF
          
          cat > admin.py << 'APPEOF'
