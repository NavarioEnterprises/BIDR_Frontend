apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  namespace: bidr
  labels:
    app: notifications-service
    service: notifications
    version: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
        service: notifications
        version: dev
    spec:
      serviceAccountName: bidr-service-account
      containers:
      - name: notifications-service
        image: python:3.11-slim
        ports:
        - containerPort: 8000
        env:
        - name: DEBUG
          value: "True"
        - name: DJANGO_SETTINGS_MODULE
          value: "notifications_service.settings"
        - name: SECRET_KEY
          value: "django-secret-key-for-notifications-service-uat-environment-2024"
        - name: ALLOWED_HOSTS
          value: "*"
        command:
        - /bin/bash
        - -c
        - |
          # Install required packages
          pip install --no-cache-dir \
            Django==5.2.5 \
            djangorestframework==3.16.1 \
            django-cors-headers==4.7.0 \
            django-filter==25.1 \
            drf-yasg==1.21.10 \
            Pillow==11.3.0 \
            django-prometheus==2.4.1 \
            django-extensions==4.1 \
            whitenoise==6.9.0 \
            celery==5.3.4 \
            redis==5.0.0 \
            django-celery-beat==2.5.0 \
            requests==2.31.0 \
            pusher==3.3.2
          
          # Create app directory and copy source
          mkdir -p /app/notifications_service
          cd /app/notifications_service
          
          # Create manage.py
          cat > manage.py << 'EOF'
          #!/usr/bin/env python
          import os
          import sys
          
          if __name__ == '__main__':
              os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'notifications_service.settings')
              try:
                  from django.core.management import execute_from_command_line
              except ImportError as exc:
                  raise ImportError(
                      "Couldn't import Django. Are you sure it's installed and "
                      "available on your PYTHONPATH environment variable? Did you "
                      "forget to activate a virtual environment?"
                  ) from exc
              execute_from_command_line(sys.argv)
          EOF
          
          # Create minimal Django project structure
          mkdir -p notifications_service
          cd notifications_service
          
          # Create __init__.py
          touch __init__.py
          
          # Create settings.py with your actual configuration
          cat > settings.py << 'EOF'
          import os
          from pathlib import Path
          
          BASE_DIR = Path(__file__).resolve().parent.parent
          
          SECRET_KEY = os.getenv('SECRET_KEY', 'django-secret-key-for-notifications-service-uat-environment-2024')
          
          DEBUG = os.getenv('DEBUG', 'True').lower() == 'true'
          
          ALLOWED_HOSTS = ['*']
          
          INSTALLED_APPS = [
              'django.contrib.admin',
              'django.contrib.auth',
              'django.contrib.contenttypes',
              'django.contrib.sessions',
              'django.contrib.messages',
              'django.contrib.staticfiles',
              'rest_framework',
              'corsheaders',
              'django_filters',
              'drf_yasg',
              'django_prometheus',
              'django_extensions',
              'django_celery_beat',
              'notifications',
              'push_notifications',
              'email_templates',
              'sms_notifications',
          ]
          
          MIDDLEWARE = [
              'corsheaders.middleware.CorsMiddleware',
              'django.middleware.security.SecurityMiddleware',
              'whitenoise.middleware.WhiteNoiseMiddleware',
              'django.contrib.sessions.middleware.SessionMiddleware',
              'django.middleware.common.CommonMiddleware',
              'django.middleware.csrf.CsrfViewMiddleware',
              'django.contrib.auth.middleware.AuthenticationMiddleware',
              'django.contrib.messages.middleware.MessageMiddleware',
              'django.middleware.clickjacking.XFrameOptionsMiddleware',
              'django_prometheus.middleware.PrometheusBeforeMiddleware',
              'django_prometheus.middleware.PrometheusAfterMiddleware',
          ]
          
          ROOT_URLCONF = 'notifications_service.urls'
          
          TEMPLATES = [
              {
                  'BACKEND': 'django.template.backends.django.DjangoTemplates',
                  'DIRS': [BASE_DIR / 'templates'],
                  'APP_DIRS': True,
                  'OPTIONS': {
                      'context_processors': [
                          'django.template.context_processors.debug',
                          'django.template.context_processors.request',
                          'django.contrib.auth.context_processors.auth',
                          'django.contrib.messages.context_processors.messages',
                      ],
                  },
              },
          ]
          
          WSGI_APPLICATION = 'notifications_service.wsgi.application'
          
          DATABASES = {
              'default': {
                  'ENGINE': 'django.db.backends.sqlite3',
                  'NAME': BASE_DIR / 'db.sqlite3',
              }
          }
          
          # Celery Configuration
          CELERY_BROKER_URL = 'redis://localhost:6379/0'
          CELERY_RESULT_BACKEND = 'redis://localhost:6379/0'
          CELERY_ACCEPT_CONTENT = ['json']
          CELERY_TASK_SERIALIZER = 'json'
          CELERY_RESULT_SERIALIZER = 'json'
          CELERY_TIMEZONE = 'UTC'
          
          # Email Configuration
          EMAIL_BACKEND = 'django.core.mail.backends.smtp.EmailBackend'
          EMAIL_HOST = 'smtp.gmail.com'
          EMAIL_PORT = 587
          EMAIL_USE_TLS = True
          EMAIL_HOST_USER = os.getenv('EMAIL_HOST_USER', 'notifications@bidr.com')
          EMAIL_HOST_PASSWORD = os.getenv('EMAIL_HOST_PASSWORD', 'your-email-password')
          DEFAULT_FROM_EMAIL = 'BIDR Notifications <notifications@bidr.com>'
          
          # Push Notification Settings
          PUSHER_APP_ID = os.getenv('PUSHER_APP_ID', 'your-pusher-app-id')
          PUSHER_KEY = os.getenv('PUSHER_KEY', 'your-pusher-key')
          PUSHER_SECRET = os.getenv('PUSHER_SECRET', 'your-pusher-secret')
          PUSHER_CLUSTER = os.getenv('PUSHER_CLUSTER', 'us2')
          
          AUTH_PASSWORD_VALIDATORS = [
              {
                  'NAME': 'django.contrib.auth.password_validation.UserAttributeSimilarityValidator',
              },
              {
                  'NAME': 'django.contrib.auth.password_validation.MinimumLengthValidator',
              },
              {
                  'NAME': 'django.contrib.auth.password_validation.CommonPasswordValidator',
              },
              {
                  'NAME': 'django.contrib.auth.password_validation.NumericPasswordValidator',
              },
          ]
          
          LANGUAGE_CODE = 'en-us'
          TIME_ZONE = 'UTC'
          USE_I18N = True
          USE_TZ = True
          
          DEFAULT_AUTO_FIELD = 'django.db.models.BigAutoField'
          
          # REST Framework Configuration
          REST_FRAMEWORK = {
              'DEFAULT_PERMISSION_CLASSES': [
                  'rest_framework.permissions.AllowAny',
              ],
              'DEFAULT_PAGINATION_CLASS': 'rest_framework.pagination.PageNumberPagination',
              'PAGE_SIZE': 20,
              'DEFAULT_RENDERER_CLASSES': [
                  'rest_framework.renderers.JSONRenderer',
                  'rest_framework.renderers.BrowsableAPIRenderer',
              ],
          }
          
          # CORS Configuration
          CORS_ALLOW_ALL_ORIGINS = True
          CORS_ALLOW_CREDENTIALS = True
          
          # URL Prefix Configuration for Reverse Proxy
          FORCE_SCRIPT_NAME = '/notifications'
          USE_X_FORWARDED_HOST = True
          SECURE_PROXY_SSL_HEADER = ('HTTP_X_FORWARDED_PROTO', 'https')
          
          # Static files configuration with prefix
          STATIC_URL = '/notifications/static/'
          STATIC_ROOT = BASE_DIR / 'staticfiles'
          EOF
          
          # Create urls.py
          cat > urls.py << 'EOF'
          from django.contrib import admin
          from django.urls import path, include
          from django.http import JsonResponse, HttpResponse
          from rest_framework import permissions
          from drf_yasg.views import get_schema_view
          from drf_yasg import openapi
          from django_prometheus.exports import ExportToDjangoView
          
          # API documentation schema
          schema_view = get_schema_view(
              openapi.Info(
                  title="BIDR Notifications Service API",
                  default_version='v1',
                  description="Real Django Notifications System with Push, Email, and SMS Support",
                  terms_of_service="https://www.bidr.com/terms/",
                  contact=openapi.Contact(email="contact@bidr.com"),
                  license=openapi.License(name="BSD License"),
              ),
              public=True,
              permission_classes=(permissions.AllowAny,),
          )
          
          def health_check(request):
              return JsonResponse({
                  'status': 'healthy',
                  'service': 'notifications-service',
                  'version': '1.0.0',
                  'message': 'Real Django notifications application',
                  'features': ['Push notifications', 'Email notifications', 'SMS notifications', 'Scheduled notifications']
              })
          
          def home_view(request):
              return HttpResponse('''
          <!DOCTYPE html>
          <html>
          <head>
              <title>BIDR Notifications Service</title>
              <style>
                  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
                  .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
                  .header { background: rgba(255,255,255,0.95); border-radius: 15px; padding: 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 30px; }
                  .title { color: #2c3e50; font-size: 3em; margin: 0; font-weight: 300; }
                  .subtitle { color: #7f8c8d; font-size: 1.2em; margin: 10px 0; }
                  .badge { background: #27ae60; color: white; padding: 8px 16px; border-radius: 20px; font-size: 0.9em; display: inline-block; }
                  .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin: 30px 0; }
                  .nav-card { background: rgba(255,255,255,0.9); border-radius: 12px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); transition: transform 0.3s ease; }
                  .nav-card:hover { transform: translateY(-5px); }
                  .nav-card h3 { color: #2c3e50; margin-top: 0; font-size: 1.5em; }
                  .nav-link { display: block; background: #3498db; color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; text-align: center; margin: 10px 0; transition: background 0.3s; }
                  .nav-link:hover { background: #2980b9; }
                  .nav-link.admin { background: #e74c3c; }
                  .nav-link.admin:hover { background: #c0392b; }
                  .nav-link.api { background: #9b59b6; }
                  .nav-link.api:hover { background: #8e44ad; }
                  .features { display: flex; flex-wrap: wrap; gap: 15px; margin: 20px 0; }
                  .feature { background: rgba(46, 204, 113, 0.1); color: #27ae60; padding: 8px 16px; border-radius: 20px; font-size: 0.9em; }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h1 class="title">🔔 BIDR Notifications</h1>
                      <p class="subtitle">Comprehensive Notification System</p>
                      <span class="badge">✅ RUNNING LIVE</span>
                  </div>
                  
                  <div class="nav-grid">
                      <div class="nav-card">
                          <h3>🛠️ Administration</h3>
                          <p>Manage notifications, templates, and user preferences</p>
                          <a href="/admin/" class="nav-link admin">Django Admin Panel</a>
                          <a href="/admin/notifications/" class="nav-link admin">Notifications Management</a>
                      </div>
                      
                      <div class="nav-card">
                          <h3>📊 API Documentation</h3>
                          <p>Interactive API documentation and testing interface</p>
                          <a href="/swagger/" class="nav-link api">Swagger UI</a>
                          <a href="/redoc/" class="nav-link api">ReDoc</a>
                          <a href="/swagger.json" class="nav-link api">OpenAPI Spec</a>
                      </div>
                      
                      <div class="nav-card">
                          <h3>🔧 System Health</h3>
                          <p>Monitor system status and performance metrics</p>
                          <a href="/health/" class="nav-link">Health Check</a>
                          <a href="/metrics" class="nav-link">Prometheus Metrics</a>
                      </div>
                  </div>
                  
                  <div class="nav-card">
                      <h3>🚀 Features</h3>
                      <div class="features">
                          <span class="feature">Django 5.2.5</span>
                          <span class="feature">Push Notifications</span>
                          <span class="feature">Email Templates</span>
                          <span class="feature">SMS Notifications</span>
                          <span class="feature">Scheduled Tasks</span>
                          <span class="feature">Celery Workers</span>
                          <span class="feature">REST API</span>
                          <span class="feature">CORS Enabled</span>
                      </div>
                  </div>
              </div>
          </body>
          </html>
              ''')
          
          urlpatterns = [
              # Admin interface
              path('admin/', admin.site.urls),
              
              # Health check
              path('health/', health_check, name='health-check'),
              path('metrics', ExportToDjangoView, name='prometheus-django-metrics'),
              
              # API documentation
              path('', home_view, name='home'),
              path('swagger/', schema_view.with_ui('swagger', cache_timeout=0), name='schema-swagger-ui'),
              path('redoc/', schema_view.with_ui('redoc', cache_timeout=0), name='schema-redoc'),
              path('swagger.json', schema_view.without_ui(cache_timeout=0), name='schema-json'),
              
              # App URLs
              path('api/notifications/', include('notifications.urls')),
              path('api/push/', include('push_notifications.urls')),
              path('api/email/', include('email_templates.urls')),
              path('api/sms/', include('sms_notifications.urls')),
          ]
          EOF
          
          # Create wsgi.py
          cat > wsgi.py << 'EOF'
          import os
          from django.core.wsgi import get_wsgi_application
          
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'notifications_service.settings')
          
          application = get_wsgi_application()
          EOF
          
          # Go back to project root
          cd /app/notifications_service
          
          # Create Django apps structure
          # Notifications app
          mkdir -p notifications
          cd notifications
          touch __init__.py
          cat > models.py << 'APPEOF'
          from django.db import models
          from django.contrib.auth.models import User
          
          class BaseModel(models.Model):
              created_at = models.DateTimeField(auto_now_add=True)
              updated_at = models.DateTimeField(auto_now=True)
              
              class Meta:
                  abstract = True
          
          class NotificationType(models.TextChoices):
              EMAIL = 'email', 'Email'
              PUSH = 'push', 'Push Notification'
              SMS = 'sms', 'SMS'
              IN_APP = 'in_app', 'In-App'
          
          class NotificationTemplate(BaseModel):
              name = models.CharField(max_length=255)
              notification_type = models.CharField(max_length=50, choices=NotificationType.choices)
              subject = models.CharField(max_length=255, blank=True)
              template_content = models.TextField()
              is_active = models.BooleanField(default=True)
              
              def __str__(self):
                  return f"{self.name} ({self.notification_type})"
          
          class Notification(BaseModel):
              user = models.ForeignKey(User, on_delete=models.CASCADE)
              notification_type = models.CharField(max_length=50, choices=NotificationType.choices)
              title = models.CharField(max_length=255)
              message = models.TextField()
              is_read = models.BooleanField(default=False)
              is_sent = models.BooleanField(default=False)
              scheduled_for = models.DateTimeField(null=True, blank=True)
              sent_at = models.DateTimeField(null=True, blank=True)
              
              class Meta:
                  ordering = ['-created_at']
          
              def __str__(self):
                  return f"{self.user.username}: {self.title}"
          APPEOF
          
          cat > admin.py << 'APPEOF'
          from django.contrib import admin
          from .models import Notification, NotificationTemplate
          
          @admin.register(NotificationTemplate)
          class NotificationTemplateAdmin(admin.ModelAdmin):
              list_display = ['name', 'notification_type', 'is_active', 'created_at']
              list_filter = ['notification_type', 'is_active', 'created_at']
              search_fields = ['name', 'subject', 'template_content']
          
          @admin.register(Notification)
          class NotificationAdmin(admin.ModelAdmin):
              list_display = ['user', 'title', 'notification_type', 'is_read', 'is_sent', 'created_at']
              list_filter = ['notification_type', 'is_read', 'is_sent', 'created_at']
              search_fields = ['user__username', 'title', 'message']
          APPEOF
          
          cat > apps.py << 'APPEOF'
          from django.apps import AppConfig
          
          class NotificationsConfig(AppConfig):
              default_auto_field = 'django.db.models.BigAutoField'
              name = 'notifications'
          APPEOF
          
          cat > urls.py << 'APPEOF'
          from django.urls import path
          from django.http import JsonResponse
          
          def notifications_placeholder(request):
              return JsonResponse({
                  'message': 'Notifications service is running', 
                  'status': 'active',
                  'features': ['Email notifications', 'Push notifications', 'SMS notifications', 'Templates', 'Scheduled notifications']
              })
          
          urlpatterns = [
              path('', notifications_placeholder, name='notifications-placeholder'),
          ]
          APPEOF
          
          cd ..
          
          # Push notifications app
          mkdir -p push_notifications
          cd push_notifications
          touch __init__.py
          cat > models.py << 'APPEOF'
          from django.db import models
          from django.contrib.auth.models import User
          
          class BaseModel(models.Model):
              created_at = models.DateTimeField(auto_now_add=True)
              updated_at = models.DateTimeField(auto_now=True)
              
              class Meta:
                  abstract = True
          
          class DeviceToken(BaseModel):
              user = models.ForeignKey(User, on_delete=models.CASCADE)
              token = models.CharField(max_length=255, unique=True)
              platform = models.CharField(max_length=50)
              is_active = models.BooleanField(default=True)
              
              def __str__(self):
                  return f"{self.user.username} - {self.platform}"
          APPEOF
          
          cat > admin.py << 'APPEOF'
          from django.contrib import admin
          from .models import DeviceToken
          
          @admin.register(DeviceToken)
          class DeviceTokenAdmin(admin.ModelAdmin):
              list_display = ['user', 'platform', 'is_active', 'created_at']
              list_filter = ['platform', 'is_active', 'created_at']
              search_fields = ['user__username', 'token']
          APPEOF
          
          cat > apps.py << 'APPEOF'
          from django.apps import AppConfig
          
          class PushNotificationsConfig(AppConfig):
              default_auto_field = 'django.db.models.BigAutoField'
              name = 'push_notifications'
          APPEOF
          
          cat > urls.py << 'APPEOF'
          from django.urls import path
          from django.http import JsonResponse
          
          def push_placeholder(request):
              return JsonResponse({
                  'message': 'Push notifications service is running', 
                  'status': 'active'
              })
          
          urlpatterns = [
              path('', push_placeholder, name='push-placeholder'),
          ]
          APPEOF
          
          cd ..
          
          # Email templates app
          mkdir -p email_templates
          cd email_templates
          touch __init__.py
          cat > models.py << 'APPEOF'
          from django.db import models
          
          class BaseModel(models.Model):
              created_at = models.DateTimeField(auto_now_add=True)
              updated_at = models.DateTimeField(auto_now=True)
              
              class Meta:
                  abstract = True
          
          class EmailTemplate(BaseModel):
              name = models.CharField(max_length=255)
              subject = models.CharField(max_length=255)
              html_content = models.TextField()
              text_content = models.TextField(blank=True)
              is_active = models.BooleanField(default=True)
              
              def __str__(self):
                  return self.name
          APPEOF
          
          cat > admin.py << 'APPEOF'
          from django.contrib import admin
          from .models import EmailTemplate
          
          @admin.register(EmailTemplate)
          class EmailTemplateAdmin(admin.ModelAdmin):
              list_display = ['name', 'subject', 'is_active', 'created_at']
              list_filter = ['is_active', 'created_at']
              search_fields = ['name', 'subject']
          APPEOF
          
          cat > apps.py << 'APPEOF'
          from django.apps import AppConfig
          
          class EmailTemplatesConfig(AppConfig):
              default_auto_field = 'django.db.models.BigAutoField'
              name = 'email_templates'
          APPEOF
          
          cat > urls.py << 'APPEOF'
          from django.urls import path
          from django.http import JsonResponse
          
          def email_placeholder(request):
              return JsonResponse({
                  'message': 'Email templates service is running', 
                  'status': 'active'
              })
          
          urlpatterns = [
              path('', email_placeholder, name='email-placeholder'),
          ]
          APPEOF
          
          cd ..
          
          # SMS notifications app
          mkdir -p sms_notifications
          cd sms_notifications
          touch __init__.py
          cat > models.py << 'APPEOF'
          from django.db import models
          from django.contrib.auth.models import User
          
          class BaseModel(models.Model):
              created_at = models.DateTimeField(auto_now_add=True)
              updated_at = models.DateTimeField(auto_now=True)
              
              class Meta:
                  abstract = True
          
          class SMSMessage(BaseModel):
              user = models.ForeignKey(User, on_delete=models.CASCADE)
              phone_number = models.CharField(max_length=20)
              message = models.TextField()
              is_sent = models.BooleanField(default=False)
              sent_at = models.DateTimeField(null=True, blank=True)
              
              def __str__(self):
                  return f"SMS to {self.phone_number}"
          APPEOF
          
          cat > admin.py << 'APPEOF'
          from django.contrib import admin
          from .models import SMSMessage
          
          @admin.register(SMSMessage)
          class SMSMessageAdmin(admin.ModelAdmin):
              list_display = ['user', 'phone_number', 'is_sent', 'sent_at', 'created_at']
              list_filter = ['is_sent', 'created_at']
              search_fields = ['user__username', 'phone_number', 'message']
          APPEOF
          
          cat > apps.py << 'APPEOF'
          from django.apps import AppConfig
          
          class SmsNotificationsConfig(AppConfig):
              default_auto_field = 'django.db.models.BigAutoField'
              name = 'sms_notifications'
          APPEOF
          
          cat > urls.py << 'APPEOF'
          from django.urls import path
          from django.http import JsonResponse
          
          def sms_placeholder(request):
              return JsonResponse({
                  'message': 'SMS notifications service is running', 
                  'status': 'active'
              })
          
          urlpatterns = [
              path('', sms_placeholder, name='sms-placeholder'),
          ]
          APPEOF
          
          cd ..
          
          # Create templates directory
          mkdir -p templates/email
          
          # Run Django setup commands
          python manage.py migrate
          echo "from django.contrib.auth.models import User; User.objects.create_superuser('admin', 'admin@example.com', 'admin123') if not User.objects.filter(username='admin').exists() else None" | python manage.py shell
          python manage.py collectstatic --noinput
          
          # Start Django development server
          python manage.py runserver 0.0.0.0:8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  namespace: bidr
  labels:
    app: notifications-service
spec:
  type: ClusterIP
  selector:
    app: notifications-service
  ports:
  - port: 8009
    targetPort: 8000
    protocol: TCP
    name: http