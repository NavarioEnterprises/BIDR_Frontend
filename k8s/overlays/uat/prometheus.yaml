apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      # - "first_rules.yml"
      # - "second_rules.yml"
    
    scrape_configs:
      # Kubernetes pods with prometheus annotations
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
            - bidr-uat
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: kubernetes_pod_name
        - source_labels: [__meta_kubernetes_pod_label_app]
          action: replace
          target_label: bidr_service
      
      # BIDR Django Services
      - job_name: 'bidr-auth-service'
        static_configs:
        - targets: ['auth-service.bidr-uat.svc.cluster.local:8001']
          labels:
            service: 'auth'
            app: 'bidr'
            environment: 'uat'
        metrics_path: '/metrics'
        scrape_interval: 30s
      
      - job_name: 'bidr-chat-service'
        static_configs:
        - targets: ['chat-service.bidr-uat.svc.cluster.local:8002']
          labels:
            service: 'chat'
            app: 'bidr'
            environment: 'uat'
        metrics_path: '/metrics'
        scrape_interval: 30s
      
      - job_name: 'bidr-payment-service'
        static_configs:
        - targets: ['payment-service.bidr-uat.svc.cluster.local:8003']
          labels:
            service: 'payment'
            app: 'bidr'
            environment: 'uat'
        metrics_path: '/metrics'
        scrape_interval: 30s
      
      - job_name: 'bidr-product-service'
        static_configs:
        - targets: ['product-management-service.bidr-uat.svc.cluster.local:8004']
          labels:
            service: 'product-management'
            app: 'bidr'
            environment: 'uat'
        metrics_path: '/metrics'
        scrape_interval: 30s
      
      - job_name: 'bidr-notifications-service'
        static_configs:
        - targets: ['notifications-service.bidr-uat.svc.cluster.local:8005']
          labels:
            service: 'notifications'
            app: 'bidr'
            environment: 'uat'
        metrics_path: '/metrics'
        scrape_interval: 30s
      
      - job_name: 'bidr-transactions-service'
        static_configs:
        - targets: ['transactions-service.bidr-uat.svc.cluster.local:8006']
          labels:
            service: 'transactions'
            app: 'bidr'
            environment: 'uat'
        metrics_path: '/metrics'
        scrape_interval: 30s
      
      - job_name: 'bidr-reviews-service'
        static_configs:
        - targets: ['reviews-service.bidr-uat.svc.cluster.local:8007']
          labels:
            service: 'reviews'
            app: 'bidr'
            environment: 'uat'
        metrics_path: '/metrics'
        scrape_interval: 30s
      
      - job_name: 'bidr-resolution-service'
        static_configs:
        - targets: ['resolution-service.bidr-uat.svc.cluster.local:8008']
          labels:
            service: 'resolution'
            app: 'bidr'
            environment: 'uat'
        metrics_path: '/metrics'
        scrape_interval: 30s
      
      # Infrastructure monitoring
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
        - role: node
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/${1}/proxy/metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus/
        - name: storage-volume
          mountPath: /prometheus/
        command:
          - '/bin/prometheus'
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--web.console.libraries=/etc/prometheus/console_libraries'
          - '--web.console.templates=/etc/prometheus/consoles'
          - '--storage.tsdb.retention.time=200h'
          - '--web.enable-lifecycle'
        resources:
          requests:
            memory: "400Mi"
            cpu: "200m"
          limits:
            memory: "800Mi"
            cpu: "500m"
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config
      - name: storage-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
