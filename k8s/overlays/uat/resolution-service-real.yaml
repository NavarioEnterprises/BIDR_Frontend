          from django.db import models
          from django.contrib.auth.models import User
          from disputes.models import Dispute
          import uuid
          
          class BaseModel(models.Model):
              created_at = models.DateTimeField(auto_now_add=True)
              updated_at = models.DateTimeField(auto_now=True)
              
              class Meta:
                  abstract = True
          
          class Document(BaseModel):
              id = models.UUIDField(primary_key=True, default=uuid.uuid4, editable=False)
              dispute = models.ForeignKey(Dispute, on_delete=models.CASCADE, related_name='documents')
              title = models.CharField(max_length=255)
              description = models.TextField(blank=True)
              file = models.FileField(upload_to='documents/')
              document_type = models.CharField(max_length=100, choices=[
                  ('evidence', 'Evidence'),
                  ('contract', 'Contract'),
                  ('communication', 'Communication'),
                  ('decision', 'Decision'),
                  ('agreement', 'Agreement'),
                  ('other', 'Other'),
              ])
              uploaded_by = models.ForeignKey(User, on_delete=models.CASCADE)
              is_confidential = models.BooleanField(default=False)
              access_level = models.CharField(max_length=50, choices=[
                  ('public', 'Public'),
                  ('parties_only', 'Parties Only'),
                  ('mediator_only', 'Mediator Only'),
                  ('arbitrator_only', 'Arbitrator Only'),
                  ('admin_only', 'Admin Only'),
              ], default='parties_only')
              
              def __str__(self):
