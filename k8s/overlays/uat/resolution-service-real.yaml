apiVersion: apps/v1
kind: Deployment
metadata:
  name: resolution-service
  namespace: bidr
  labels:
    app: resolution-service
    service: resolution
    version: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resolution-service
  template:
    metadata:
      labels:
        app: resolution-service
        service: resolution
        version: dev
    spec:
      serviceAccountName: bidr-service-account
      containers:
      - name: resolution-service
        image: python:3.11-slim
        ports:
        - containerPort: 8000
        env:
        - name: DEBUG
          value: "True"
        - name: DJANGO_SETTINGS_MODULE
          value: "resolution_service.settings"
        - name: SECRET_KEY
          value: "django-secret-key-for-resolution-service-uat-environment-2024"
        - name: ALLOWED_HOSTS
          value: "*"
        command:
        - /bin/bash
        - -c
        - |
          # Install required packages
          pip install --no-cache-dir \
            Django==5.2.5 \
            djangorestframework==3.16.1 \
            django-cors-headers==4.7.0 \
            django-filter==25.1 \
            drf-yasg==1.21.10 \
            Pillow==11.3.0 \
            django-prometheus==2.4.1 \
            django-extensions==4.1 \
            whitenoise==6.9.0 \
            celery==5.3.4 \
            redis==5.0.0 \
            django-celery-beat==2.5.0 \
            requests==2.31.0 \
            django-fsm==2.8.1
          
          # Create app directory and copy source
          mkdir -p /app/resolution_service
          cd /app/resolution_service
          
          # Create manage.py
          cat > manage.py << 'EOF'
          #!/usr/bin/env python
          import os
          import sys
          
          if __name__ == '__main__':
              os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'resolution_service.settings')
              try:
                  from django.core.management import execute_from_command_line
              except ImportError as exc:
                  raise ImportError(
                      "Couldn't import Django. Are you sure it's installed and "
                      "available on your PYTHONPATH environment variable? Did you "
                      "forget to activate a virtual environment?"
                  ) from exc
              execute_from_command_line(sys.argv)
          EOF
          
          # Create minimal Django project structure
          mkdir -p resolution_service
          cd resolution_service
          
          # Create __init__.py
          touch __init__.py
          
          # Create settings.py with your actual configuration
          cat > settings.py << 'EOF'
          import os
          from pathlib import Path
          
          BASE_DIR = Path(__file__).resolve().parent.parent
          
          SECRET_KEY = os.getenv('SECRET_KEY', 'django-secret-key-for-resolution-service-uat-environment-2024')
          
          DEBUG = os.getenv('DEBUG', 'True').lower() == 'true'
          
          ALLOWED_HOSTS = ['*']
          
          INSTALLED_APPS = [
              'django.contrib.admin',
              'django.contrib.auth',
              'django.contrib.contenttypes',
              'django.contrib.sessions',
              'django.contrib.messages',
              'django.contrib.staticfiles',
              'rest_framework',
              'corsheaders',
              'django_filters',
              'drf_yasg',
              'django_prometheus',
              'django_extensions',
              'django_celery_beat',
              'django_fsm',
              'disputes',
              'mediation',
              'arbitration',
              'case_management',
              'document_management',
          ]
          
          MIDDLEWARE = [
              'corsheaders.middleware.CorsMiddleware',
              'django.middleware.security.SecurityMiddleware',
              'whitenoise.middleware.WhiteNoiseMiddleware',
              'django.contrib.sessions.middleware.SessionMiddleware',
              'django.middleware.common.CommonMiddleware',
              'django.middleware.csrf.CsrfViewMiddleware',
              'django.contrib.auth.middleware.AuthenticationMiddleware',
              'django.contrib.messages.middleware.MessageMiddleware',
              'django.middleware.clickjacking.XFrameOptionsMiddleware',
              'django_prometheus.middleware.PrometheusBeforeMiddleware',
              'django_prometheus.middleware.PrometheusAfterMiddleware',
          ]
          
          ROOT_URLCONF = 'resolution_service.urls'
          
          TEMPLATES = [
              {
                  'BACKEND': 'django.template.backends.django.DjangoTemplates',
                  'DIRS': [BASE_DIR / 'templates'],
                  'APP_DIRS': True,
                  'OPTIONS': {
                      'context_processors': [
                          'django.template.context_processors.debug',
                          'django.template.context_processors.request',
                          'django.contrib.auth.context_processors.auth',
                          'django.contrib.messages.context_processors.messages',
                      ],
                  },
              },
          ]
          
          WSGI_APPLICATION = 'resolution_service.wsgi.application'
          
          DATABASES = {
              'default': {
                  'ENGINE': 'django.db.backends.sqlite3',
                  'NAME': BASE_DIR / 'db.sqlite3',
              }
          }
          
          # Celery Configuration for async processing
          CELERY_BROKER_URL = 'redis://localhost:6379/0'
          CELERY_RESULT_BACKEND = 'redis://localhost:6379/0'
          CELERY_ACCEPT_CONTENT = ['json']
          CELERY_TASK_SERIALIZER = 'json'
          CELERY_RESULT_SERIALIZER = 'json'
          CELERY_TIMEZONE = 'UTC'
          
          # File Upload Settings
          MEDIA_URL = '/media/'
          MEDIA_ROOT = BASE_DIR / 'media'
          FILE_UPLOAD_MAX_MEMORY_SIZE = 10 * 1024 * 1024  # 10MB
          DATA_UPLOAD_MAX_MEMORY_SIZE = 10 * 1024 * 1024  # 10MB
          
          # Email Configuration
          EMAIL_BACKEND = 'django.core.mail.backends.smtp.EmailBackend'
          EMAIL_HOST = 'smtp.gmail.com'
          EMAIL_PORT = 587
          EMAIL_USE_TLS = True
          EMAIL_HOST_USER = os.getenv('EMAIL_HOST_USER', 'resolution@bidr.com')
          EMAIL_HOST_PASSWORD = os.getenv('EMAIL_HOST_PASSWORD', 'your-email-password')
          DEFAULT_FROM_EMAIL = 'BIDR Resolution <resolution@bidr.com>'
          
          AUTH_PASSWORD_VALIDATORS = [
              {
                  'NAME': 'django.contrib.auth.password_validation.UserAttributeSimilarityValidator',
              },
              {
                  'NAME': 'django.contrib.auth.password_validation.MinimumLengthValidator',
              },
              {
                  'NAME': 'django.contrib.auth.password_validation.CommonPasswordValidator',
              },
              {
                  'NAME': 'django.contrib.auth.password_validation.NumericPasswordValidator',
              },
          ]
          
          LANGUAGE_CODE = 'en-us'
          TIME_ZONE = 'UTC'
          USE_I18N = True
          USE_TZ = True
          
          DEFAULT_AUTO_FIELD = 'django.db.models.BigAutoField'
          
          # REST Framework Configuration
          REST_FRAMEWORK = {
              'DEFAULT_PERMISSION_CLASSES': [
                  'rest_framework.permissions.AllowAny',
              ],
              'DEFAULT_PAGINATION_CLASS': 'rest_framework.pagination.PageNumberPagination',
              'PAGE_SIZE': 20,
              'DEFAULT_RENDERER_CLASSES': [
                  'rest_framework.renderers.JSONRenderer',
                  'rest_framework.renderers.BrowsableAPIRenderer',
              ],
          }
          
          # CORS Configuration
          CORS_ALLOW_ALL_ORIGINS = True
          CORS_ALLOW_CREDENTIALS = True
          
          # URL Prefix Configuration for Reverse Proxy
          FORCE_SCRIPT_NAME = '/resolution'
          USE_X_FORWARDED_HOST = True
          SECURE_PROXY_SSL_HEADER = ('HTTP_X_FORWARDED_PROTO', 'https')
          
          # Static files configuration with prefix
          STATIC_URL = '/resolution/static/'
          STATIC_ROOT = BASE_DIR / 'staticfiles'
          
          # Resolution Service Specific Settings
          CASE_AUTO_ASSIGNMENT = True
          MEDIATION_DEFAULT_DURATION_DAYS = 30
          ARBITRATION_DEFAULT_DURATION_DAYS = 60
          MAX_DISPUTE_AMOUNT = 10000  # Maximum dispute amount in USD
          
          # Logging Configuration
          LOGGING = {
              'version': 1,
              'disable_existing_loggers': False,
              'handlers': {
                  'file': {
                      'level': 'INFO',
                      'class': 'logging.FileHandler',
                      'filename': 'resolution_service.log',
                  },
              },
              'loggers': {
                  'resolution': {
                      'handlers': ['file'],
                      'level': 'INFO',
                      'propagate': True,
                  },
              },
          }
          EOF
          
          # Create urls.py
          cat > urls.py << 'EOF'
          from django.contrib import admin
          from django.urls import path, include
          from django.http import JsonResponse, HttpResponse
          from django.conf import settings
          from django.conf.urls.static import static
          from rest_framework import permissions
          from drf_yasg.views import get_schema_view
          from drf_yasg import openapi
          from django_prometheus.exports import ExportToDjangoView
          
          # API documentation schema
          schema_view = get_schema_view(
              openapi.Info(
                  title="BIDR Resolution Service API",
                  default_version='v1',
                  description="Dispute Resolution System with Mediation and Arbitration Support",
                  terms_of_service="https://www.bidr.com/terms/",
                  contact=openapi.Contact(email="contact@bidr.com"),
                  license=openapi.License(name="BSD License"),
              ),
              public=True,
              permission_classes=(permissions.AllowAny,),
          )
          
          def health_check(request):
              return JsonResponse({
                  'status': 'healthy',
                  'service': 'resolution-service',
                  'version': '1.0.0',
                  'message': 'Dispute resolution service',
                  'features': ['Dispute management', 'Mediation', 'Arbitration', 'Case tracking', 'Document management']
              })
          
          def home_view(request):
              return HttpResponse('''
          <!DOCTYPE html>
          <html>
          <head>
              <title>BIDR Resolution Service</title>
              <style>
                  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
                  .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
                  .header { background: rgba(255,255,255,0.95); border-radius: 15px; padding: 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 30px; }
                  .title { color: #2c3e50; font-size: 3em; margin: 0; font-weight: 300; }
                  .subtitle { color: #7f8c8d; font-size: 1.2em; margin: 10px 0; }
                  .badge { background: #27ae60; color: white; padding: 8px 16px; border-radius: 20px; font-size: 0.9em; display: inline-block; }
                  .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin: 30px 0; }
                  .nav-card { background: rgba(255,255,255,0.9); border-radius: 12px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); transition: transform 0.3s ease; }
                  .nav-card:hover { transform: translateY(-5px); }
                  .nav-card h3 { color: #2c3e50; margin-top: 0; font-size: 1.5em; }
                  .nav-link { display: block; background: #3498db; color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; text-align: center; margin: 10px 0; transition: background 0.3s; }
                  .nav-link:hover { background: #2980b9; }
                  .nav-link.admin { background: #e74c3c; }
                  .nav-link.admin:hover { background: #c0392b; }
                  .nav-link.api { background: #9b59b6; }
                  .nav-link.api:hover { background: #8e44ad; }
                  .features { display: flex; flex-wrap: wrap; gap: 15px; margin: 20px 0; }
                  .feature { background: rgba(46, 204, 113, 0.1); color: #27ae60; padding: 8px 16px; border-radius: 20px; font-size: 0.9em; }
                  .process-flow { background: rgba(255,255,255,0.9); border-radius: 12px; padding: 30px; margin-top: 20px; }
                  .process-step { background: #3498db; color: white; padding: 15px; margin: 10px 0; border-radius: 8px; text-align: center; }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h1 class="title">⚖️ BIDR Resolution Service</h1>
                      <p class="subtitle">Professional Dispute Resolution System</p>
                      <span class="badge">✅ RUNNING LIVE</span>
                  </div>
                  
                  <div class="nav-grid">
                      <div class="nav-card">
                          <h3>🛠️ Administration</h3>
                          <p>Manage disputes, cases, mediators, and arbitrators</p>
                          <a href="/admin/" class="nav-link admin">Django Admin Panel</a>
                          <a href="/admin/disputes/" class="nav-link admin">Dispute Management</a>
                      </div>
                      
                      <div class="nav-card">
                          <h3>📊 API Documentation</h3>
                          <p>Interactive API documentation and testing interface</p>
                          <a href="/swagger/" class="nav-link api">Swagger UI</a>
                          <a href="/redoc/" class="nav-link api">ReDoc</a>
                          <a href="/swagger.json" class="nav-link api">OpenAPI Spec</a>
                      </div>
                      
                      <div class="nav-card">
                          <h3>🔧 System Health</h3>
                          <p>Monitor system status and performance metrics</p>
                          <a href="/health/" class="nav-link">Health Check</a>
                          <a href="/metrics" class="nav-link">Prometheus Metrics</a>
                      </div>
                  </div>
                  
                  <div class="nav-card">
                      <h3>🚀 Features</h3>
                      <div class="features">
                          <span class="feature">Django 5.2.5</span>
                          <span class="feature">Dispute Management</span>
                          <span class="feature">Mediation Process</span>
                          <span class="feature">Arbitration System</span>
                          <span class="feature">Case Tracking</span>
                          <span class="feature">Document Management</span>
                          <span class="feature">State Machine</span>
                          <span class="feature">CORS Enabled</span>
                      </div>
                  </div>
                  
                  <div class="process-flow">
                      <h3>🔄 Resolution Process Flow</h3>
                      <div class="process-step">1. Dispute Filed → Initial Review</div>
                      <div class="process-step">2. Mediation Attempt → Negotiation</div>
                      <div class="process-step">3. Arbitration (if needed) → Final Decision</div>
                      <div class="process-step">4. Resolution Implemented → Case Closed</div>
                  </div>
              </div>
          </body>
          </html>
              ''')
          
          urlpatterns = [
              # Admin interface
              path('admin/', admin.site.urls),
              
              # Health check
              path('health/', health_check, name='health-check'),
              path('metrics', ExportToDjangoView, name='prometheus-django-metrics'),
              
              # API documentation
              path('', home_view, name='home'),
              path('swagger/', schema_view.with_ui('swagger', cache_timeout=0), name='schema-swagger-ui'),
              path('redoc/', schema_view.with_ui('redoc', cache_timeout=0), name='schema-redoc'),
              path('swagger.json', schema_view.without_ui(cache_timeout=0), name='schema-json'),
              
              # App URLs
              path('api/disputes/', include('disputes.urls')),
              path('api/mediation/', include('mediation.urls')),
              path('api/arbitration/', include('arbitration.urls')),
              path('api/cases/', include('case_management.urls')),
              path('api/documents/', include('document_management.urls')),
          ] + static(settings.MEDIA_URL, document_root=settings.MEDIA_ROOT)
          EOF
          
          # Create wsgi.py
          cat > wsgi.py << 'EOF'
          import os
          from django.core.wsgi import get_wsgi_application
          
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'resolution_service.settings')
          
          application = get_wsgi_application()
          EOF
          
          # Go back to project root
          cd /app/resolution_service
          
          # Create Django apps structure
          # Disputes app
          mkdir -p disputes
          cd disputes
          touch __init__.py
          cat > models.py << 'APPEOF'
          from django.db import models
          from django.contrib.auth.models import User
          from django_fsm import FSMField, transition
          import uuid
          
          class BaseModel(models.Model):
              created_at = models.DateTimeField(auto_now_add=True)
              updated_at = models.DateTimeField(auto_now=True)
              
              class Meta:
                  abstract = True
          
          class DisputeStatus(models.TextChoices):
              FILED = 'filed', 'Filed'
              UNDER_REVIEW = 'under_review', 'Under Review'
              IN_MEDIATION = 'in_mediation', 'In Mediation'
              IN_ARBITRATION = 'in_arbitration', 'In Arbitration'
              RESOLVED = 'resolved', 'Resolved'
              CLOSED = 'closed', 'Closed'
              CANCELLED = 'cancelled', 'Cancelled'
          
          class DisputeCategory(models.TextChoices):
              PAYMENT = 'payment', 'Payment Dispute'
              PRODUCT = 'product', 'Product/Service Dispute'
              DELIVERY = 'delivery', 'Delivery Issue'
              REFUND = 'refund', 'Refund Request'
              OTHER = 'other', 'Other'
          
          class Dispute(BaseModel):
              id = models.UUIDField(primary_key=True, default=uuid.uuid4, editable=False)
              case_number = models.CharField(max_length=50, unique=True)
              complainant = models.ForeignKey(User, on_delete=models.CASCADE, related_name='filed_disputes')
              respondent = models.ForeignKey(User, on_delete=models.CASCADE, related_name='disputes_against')
              category = models.CharField(max_length=50, choices=DisputeCategory.choices)
              subject = models.CharField(max_length=255)
              description = models.TextField()
              dispute_amount = models.DecimalField(max_digits=10, decimal_places=2, null=True, blank=True)
              status = FSMField(default=DisputeStatus.FILED, choices=DisputeStatus.choices)
              priority = models.CharField(max_length=20, choices=[('low', 'Low'), ('medium', 'Medium'), ('high', 'High')], default='medium')
              assigned_mediator = models.ForeignKey(User, on_delete=models.SET_NULL, null=True, blank=True, related_name='mediated_disputes')
              assigned_arbitrator = models.ForeignKey(User, on_delete=models.SET_NULL, null=True, blank=True, related_name='arbitrated_disputes')
              resolution_deadline = models.DateTimeField(null=True, blank=True)
              
              class Meta:
                  ordering = ['-created_at']
          
              def __str__(self):
                  return f"Dispute {self.case_number}: {self.subject}"
          
              @transition(field=status, source=DisputeStatus.FILED, target=DisputeStatus.UNDER_REVIEW)
              def start_review(self):
                  pass
          
              @transition(field=status, source=DisputeStatus.UNDER_REVIEW, target=DisputeStatus.IN_MEDIATION)
              def start_mediation(self):
                  pass
          
              @transition(field=status, source=[DisputeStatus.IN_MEDIATION, DisputeStatus.UNDER_REVIEW], target=DisputeStatus.IN_ARBITRATION)
              def start_arbitration(self):
                  pass
          
              @transition(field=status, source=[DisputeStatus.IN_MEDIATION, DisputeStatus.IN_ARBITRATION], target=DisputeStatus.RESOLVED)
              def resolve(self):
                  pass
          
              @transition(field=status, source=DisputeStatus.RESOLVED, target=DisputeStatus.CLOSED)
              def close(self):
                  pass
          
          class DisputeEvidence(BaseModel):
              dispute = models.ForeignKey(Dispute, on_delete=models.CASCADE, related_name='evidence')
              submitted_by = models.ForeignKey(User, on_delete=models.CASCADE)
              title = models.CharField(max_length=255)
              description = models.TextField()
              file = models.FileField(upload_to='dispute_evidence/', null=True, blank=True)
              is_confidential = models.BooleanField(default=False)
              
              def __str__(self):
                  return f"Evidence: {self.title}"
          APPEOF
          
          cat > admin.py << 'APPEOF'
          from django.contrib import admin
          from .models import Dispute, DisputeEvidence
          
          @admin.register(Dispute)
          class DisputeAdmin(admin.ModelAdmin):
              list_display = ['case_number', 'complainant', 'respondent', 'category', 'status', 'priority', 'created_at']
              list_filter = ['status', 'category', 'priority', 'created_at']
              search_fields = ['case_number', 'subject', 'complainant__username', 'respondent__username']
              readonly_fields = ['id', 'case_number', 'created_at', 'updated_at']
          
          @admin.register(DisputeEvidence)
          class DisputeEvidenceAdmin(admin.ModelAdmin):
              list_display = ['dispute', 'title', 'submitted_by', 'is_confidential', 'created_at']
              list_filter = ['is_confidential', 'created_at']
              search_fields = ['title', 'description', 'dispute__case_number']
          APPEOF
          
          cat > apps.py << 'APPEOF'
          from django.apps import AppConfig
          
          class DisputesConfig(AppConfig):
              default_auto_field = 'django.db.models.BigAutoField'
              name = 'disputes'
          APPEOF
          
          cat > urls.py << 'APPEOF'
          from django.urls import path
          from django.http import JsonResponse
          
          def disputes_placeholder(request):
              return JsonResponse({
                  'message': 'Disputes service is running', 
                  'status': 'active',
                  'features': ['Dispute filing', 'Case management', 'Evidence submission', 'Status tracking']
              })
          
          urlpatterns = [
              path('', disputes_placeholder, name='disputes-placeholder'),
          ]
          APPEOF
          
          cd ..
          
          # Mediation app
          mkdir -p mediation
          cd mediation
          touch __init__.py
          cat > models.py << 'APPEOF'
          from django.db import models
          from django.contrib.auth.models import User
          from disputes.models import Dispute
          
          class BaseModel(models.Model):
              created_at = models.DateTimeField(auto_now_add=True)
              updated_at = models.DateTimeField(auto_now=True)
              
              class Meta:
                  abstract = True
          
          class MediationSession(BaseModel):
              dispute = models.OneToOneField(Dispute, on_delete=models.CASCADE)
              mediator = models.ForeignKey(User, on_delete=models.CASCADE, related_name='mediation_sessions')
              start_date = models.DateTimeField()
              end_date = models.DateTimeField(null=True, blank=True)
              status = models.CharField(max_length=50, choices=[
                  ('scheduled', 'Scheduled'),
                  ('in_progress', 'In Progress'),
                  ('successful', 'Successful'),
                  ('failed', 'Failed'),
                  ('cancelled', 'Cancelled'),
              ], default='scheduled')
              outcome = models.TextField(blank=True)
              agreement_reached = models.BooleanField(default=False)
              
              def __str__(self):
                  return f"Mediation for {self.dispute.case_number}"
          
          class MediationMessage(BaseModel):
              session = models.ForeignKey(MediationSession, on_delete=models.CASCADE, related_name='messages')
              sender = models.ForeignKey(User, on_delete=models.CASCADE)
              message = models.TextField()
              is_private_note = models.BooleanField(default=False)
              
              class Meta:
                  ordering = ['created_at']
          
              def __str__(self):
                  return f"Message from {self.sender.username}"
          APPEOF
          
          cat > admin.py << 'APPEOF'
          from django.contrib import admin
          from .models import MediationSession, MediationMessage
          
          @admin.register(MediationSession)
          class MediationSessionAdmin(admin.ModelAdmin):
              list_display = ['dispute', 'mediator', 'status', 'agreement_reached', 'start_date']
              list_filter = ['status', 'agreement_reached', 'created_at']
              search_fields = ['dispute__case_number', 'mediator__username']
          
          @admin.register(MediationMessage)
          class MediationMessageAdmin(admin.ModelAdmin):
              list_display = ['session', 'sender', 'is_private_note', 'created_at']
              list_filter = ['is_private_note', 'created_at']
              search_fields = ['session__dispute__case_number', 'sender__username', 'message']
          APPEOF
          
          cat > apps.py << 'APPEOF'
          from django.apps import AppConfig
          
          class MediationConfig(AppConfig):
              default_auto_field = 'django.db.models.BigAutoField'
              name = 'mediation'
          APPEOF
          
          cat > urls.py << 'APPEOF'
          from django.urls import path
          from django.http import JsonResponse
          
          def mediation_placeholder(request):
              return JsonResponse({
                  'message': 'Mediation service is running', 
                  'status': 'active'
              })
          
          urlpatterns = [
              path('', mediation_placeholder, name='mediation-placeholder'),
          ]
          APPEOF
          
          cd ..
          
          # Arbitration app
          mkdir -p arbitration
          cd arbitration
          touch __init__.py
          cat > models.py << 'APPEOF'
          from django.db import models
          from django.contrib.auth.models import User
          from disputes.models import Dispute
          
          class BaseModel(models.Model):
              created_at = models.DateTimeField(auto_now_add=True)
              updated_at = models.DateTimeField(auto_now=True)
              
              class Meta:
                  abstract = True
          
          class ArbitrationCase(BaseModel):
              dispute = models.OneToOneField(Dispute, on_delete=models.CASCADE)
              arbitrator = models.ForeignKey(User, on_delete=models.CASCADE, related_name='arbitration_cases')
              hearing_date = models.DateTimeField(null=True, blank=True)
              decision_date = models.DateTimeField(null=True, blank=True)
              status = models.CharField(max_length=50, choices=[
                  ('initiated', 'Initiated'),
                  ('evidence_review', 'Evidence Review'),
                  ('hearing_scheduled', 'Hearing Scheduled'),
                  ('under_deliberation', 'Under Deliberation'),
