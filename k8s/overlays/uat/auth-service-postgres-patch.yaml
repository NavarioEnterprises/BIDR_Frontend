apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: bidr
spec:
  template:
    spec:
      containers:
      - name: auth-service
        envFrom:
        - secretRef:
            name: auth-db-secret
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: DJANGO_SETTINGS_MODULE
          value: "authentication_service.settings"