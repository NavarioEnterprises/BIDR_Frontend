apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: bidr
  labels:
    app: chat-service
    service: chat
    version: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
        service: chat
        version: dev
    spec:
      serviceAccountName: bidr-service-account
      containers:
      - name: chat-service
        image: python:3.11-slim
        ports:
        - containerPort: 8000
        env:
        - name: DEBUG
          value: "True"
        - name: DJANGO_SETTINGS_MODULE
          value: "chat_service.settings"
        - name: SECRET_KEY
          value: "django-secret-key-for-chat-service-uat-environment-2024"
        - name: ALLOWED_HOSTS
          value: "*"
        command:
        - /bin/bash
        - -c
        - |
          # Install required packages
          pip install --no-cache-dir \
            Django==5.2.5 \
            djangorestframework==3.16.1 \
            django-cors-headers==4.7.0 \
            django-filter==25.1 \
            drf-yasg==1.21.10 \
            Pillow==11.3.0 \
            django-prometheus==2.4.1 \
            django-extensions==4.1 \
            whitenoise==6.9.0 \
            channels==4.0.0 \
            channels-redis==4.1.0 \
            redis==5.0.0 \
            daphne==4.0.0
          
          # Create app directory and copy source
          mkdir -p /app/chat_service
          cd /app/chat_service
          
          # Create manage.py
          cat > manage.py << 'EOF'
          #!/usr/bin/env python
          import os
          import sys
          
          if __name__ == '__main__':
              os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'chat_service.settings')
              try:
                  from django.core.management import execute_from_command_line
              except ImportError as exc:
                  raise ImportError(
                      "Couldn't import Django. Are you sure it's installed and "
                      "available on your PYTHONPATH environment variable? Did you "
                      "forget to activate a virtual environment?"
                  ) from exc
              execute_from_command_line(sys.argv)
          EOF
          
          # Create minimal Django project structure
          mkdir -p chat_service
          cd chat_service
          
          # Create __init__.py
          touch __init__.py
          
          # Create settings.py with your actual configuration
          cat > settings.py << 'EOF'
          import os
          from pathlib import Path
          
          BASE_DIR = Path(__file__).resolve().parent.parent
          
          SECRET_KEY = os.getenv('SECRET_KEY', 'django-secret-key-for-chat-service-uat-environment-2024')
          
          DEBUG = os.getenv('DEBUG', 'True').lower() == 'true'
          
          ALLOWED_HOSTS = ['*']
          
          INSTALLED_APPS = [
              'daphne',
              'django.contrib.admin',
              'django.contrib.auth',
              'django.contrib.contenttypes',
              'django.contrib.sessions',
              'django.contrib.messages',
              'django.contrib.staticfiles',
              'channels',
              'rest_framework',
              'corsheaders',
              'django_filters',
              'drf_yasg',
              'django_prometheus',
              'django_extensions',
              'chat',
              'notifications',
          ]
          
          MIDDLEWARE = [
              'corsheaders.middleware.CorsMiddleware',
              'django.middleware.security.SecurityMiddleware',
              'whitenoise.middleware.WhiteNoiseMiddleware',
              'django.contrib.sessions.middleware.SessionMiddleware',
              'django.middleware.common.CommonMiddleware',
              'django.middleware.csrf.CsrfViewMiddleware',
              'django.contrib.auth.middleware.AuthenticationMiddleware',
              'django.contrib.messages.middleware.MessageMiddleware',
              'django.middleware.clickjacking.XFrameOptionsMiddleware',
              'django_prometheus.middleware.PrometheusBeforeMiddleware',
              'django_prometheus.middleware.PrometheusAfterMiddleware',
          ]
          
          ROOT_URLCONF = 'chat_service.urls'
          ASGI_APPLICATION = 'chat_service.asgi.application'
          
          TEMPLATES = [
              {
                  'BACKEND': 'django.template.backends.django.DjangoTemplates',
                  'DIRS': [],
                  'APP_DIRS': True,
                  'OPTIONS': {
                      'context_processors': [
                          'django.template.context_processors.debug',
                          'django.template.context_processors.request',
                          'django.contrib.auth.context_processors.auth',
                          'django.contrib.messages.context_processors.messages',
                      ],
                  },
              },
          ]
          
          WSGI_APPLICATION = 'chat_service.wsgi.application'
          
          DATABASES = {
              'default': {
                  'ENGINE': 'django.db.backends.sqlite3',
                  'NAME': BASE_DIR / 'db.sqlite3',
              }
          }
          
          # In-memory channel layer for development (no Redis required)
          CHANNEL_LAYERS = {
              'default': {
                  'BACKEND': 'channels.layers.InMemoryChannelLayer'
              },
          }
          
          AUTH_PASSWORD_VALIDATORS = [
              {
                  'NAME': 'django.contrib.auth.password_validation.UserAttributeSimilarityValidator',
              },
              {
                  'NAME': 'django.contrib.auth.password_validation.MinimumLengthValidator',
              },
              {
                  'NAME': 'django.contrib.auth.password_validation.CommonPasswordValidator',
              },
              {
                  'NAME': 'django.contrib.auth.password_validation.NumericPasswordValidator',
              },
          ]
          
          LANGUAGE_CODE = 'en-us'
          TIME_ZONE = 'UTC'
          USE_I18N = True
          USE_TZ = True
          
          DEFAULT_AUTO_FIELD = 'django.db.models.BigAutoField'
          
          # REST Framework Configuration
          REST_FRAMEWORK = {
              'DEFAULT_PERMISSION_CLASSES': [
                  'rest_framework.permissions.AllowAny',
              ],
              'DEFAULT_PAGINATION_CLASS': 'rest_framework.pagination.PageNumberPagination',
              'PAGE_SIZE': 20,
              'DEFAULT_RENDERER_CLASSES': [
                  'rest_framework.renderers.JSONRenderer',
                  'rest_framework.renderers.BrowsableAPIRenderer',
              ],
          }
          
          # CORS Configuration
          CORS_ALLOW_ALL_ORIGINS = True
          CORS_ALLOW_CREDENTIALS = True
          
          # URL Prefix Configuration for Reverse Proxy
          FORCE_SCRIPT_NAME = '/chat'
          USE_X_FORWARDED_HOST = True
          SECURE_PROXY_SSL_HEADER = ('HTTP_X_FORWARDED_PROTO', 'https')
          
          # Static files configuration with prefix
          STATIC_URL = '/chat/static/'
          STATIC_ROOT = BASE_DIR / 'staticfiles'
          EOF
          
          # Create urls.py
          cat > urls.py << 'EOF'
          from django.contrib import admin
          from django.urls import path, include
          from django.http import JsonResponse, HttpResponse
          from rest_framework import permissions
          from drf_yasg.views import get_schema_view
          from drf_yasg import openapi
          from django_prometheus.exports import ExportToDjangoView
          
          # API documentation schema
          schema_view = get_schema_view(
              openapi.Info(
                  title="BIDR Chat Service API",
                  default_version='v1',
                  description="Real Django Chat System with WebSocket Support",
                  terms_of_service="https://www.bidr.com/terms/",
                  contact=openapi.Contact(email="contact@bidr.com"),
                  license=openapi.License(name="BSD License"),
              ),
              public=True,
              permission_classes=(permissions.AllowAny,),
          )
          
          def health_check(request):
              return JsonResponse({
                  'status': 'healthy',
                  'service': 'chat-service',
                  'version': '1.0.0',
                  'message': 'Real Django Chat application',
                  'websocket_support': True
              })
          
          def home_view(request):
              return HttpResponse('''
          <!DOCTYPE html>
          <html>
          <head>
              <title>BIDR Chat Service</title>
              <style>
                  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
                  .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
                  .header { background: rgba(255,255,255,0.95); border-radius: 15px; padding: 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 30px; }
                  .title { color: #2c3e50; font-size: 3em; margin: 0; font-weight: 300; }
                  .subtitle { color: #7f8c8d; font-size: 1.2em; margin: 10px 0; }
                  .badge { background: #27ae60; color: white; padding: 8px 16px; border-radius: 20px; font-size: 0.9em; display: inline-block; }
                  .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin: 30px 0; }
                  .nav-card { background: rgba(255,255,255,0.9); border-radius: 12px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); transition: transform 0.3s ease; }
                  .nav-card:hover { transform: translateY(-5px); }
                  .nav-card h3 { color: #2c3e50; margin-top: 0; font-size: 1.5em; }
                  .nav-link { display: block; background: #3498db; color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; text-align: center; margin: 10px 0; transition: background 0.3s; }
                  .nav-link:hover { background: #2980b9; }
                  .nav-link.admin { background: #e74c3c; }
                  .nav-link.admin:hover { background: #c0392b; }
                  .nav-link.api { background: #9b59b6; }
                  .nav-link.api:hover { background: #8e44ad; }
                  .features { display: flex; flex-wrap: wrap; gap: 15px; margin: 20px 0; }
                  .feature { background: rgba(46, 204, 113, 0.1); color: #27ae60; padding: 8px 16px; border-radius: 20px; font-size: 0.9em; }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h1 class="title">💬 BIDR Chat Service</h1>
                      <p class="subtitle">Real-time Chat System with WebSocket Support</p>
                      <span class="badge">✅ RUNNING LIVE</span>
                  </div>
                  
                  <div class="nav-grid">
                      <div class="nav-card">
                          <h3>🛠️ Administration</h3>
                          <p>Manage chat rooms, messages, and user interactions</p>
                          <a href="/admin/" class="nav-link admin">Django Admin Panel</a>
                          <a href="/admin/auth/user/" class="nav-link admin">User Management</a>
                      </div>
                      
                      <div class="nav-card">
                          <h3>📊 API Documentation</h3>
                          <p>Interactive API documentation and testing interface</p>
                          <a href="/swagger/" class="nav-link api">Swagger UI</a>
                          <a href="/redoc/" class="nav-link api">ReDoc</a>
                          <a href="/swagger.json" class="nav-link api">OpenAPI Spec</a>
                      </div>
                      
                      <div class="nav-card">
                          <h3>🔧 System Health</h3>
                          <p>Monitor system status and performance metrics</p>
                          <a href="/health/" class="nav-link">Health Check</a>
                          <a href="/metrics" class="nav-link">Prometheus Metrics</a>
                      </div>
                  </div>
                  
                  <div class="nav-card">
                      <h3>🚀 Features</h3>
                      <div class="features">
                          <span class="feature">Django 5.2.5</span>
                          <span class="feature">Django Channels</span>
                          <span class="feature">WebSocket Support</span>
                          <span class="feature">Real-time Chat</span>
                          <span class="feature">Notifications</span>
                          <span class="feature">Redis Backend</span>
                          <span class="feature">REST API</span>
                          <span class="feature">CORS Enabled</span>
                      </div>
                  </div>
              </div>
          </body>
          </html>
              ''')
          
          urlpatterns = [
              # Admin interface
              path('admin/', admin.site.urls),
              
              # Health check
              path('health/', health_check, name='health-check'),
              path('metrics', ExportToDjangoView, name='prometheus-django-metrics'),
              
              # API documentation
              path('', home_view, name='home'),
              path('swagger/', schema_view.with_ui('swagger', cache_timeout=0), name='schema-swagger-ui'),
              path('redoc/', schema_view.with_ui('redoc', cache_timeout=0), name='schema-redoc'),
              path('swagger.json', schema_view.without_ui(cache_timeout=0), name='schema-json'),
              
              # App URLs
              path('api/chat/', include('chat.urls')),
              path('api/notifications/', include('notifications.urls')),
          ]
          EOF
          
          # Create asgi.py
          cat > asgi.py << 'EOF'
          import os
          from django.core.asgi import get_asgi_application
          from channels.routing import ProtocolTypeRouter, URLRouter
          from channels.auth import AuthMiddlewareStack
          
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'chat_service.settings')
          
          django_asgi_app = get_asgi_application()
          
          # Import routing after Django setup
          from chat.routing import websocket_urlpatterns
          
          application = ProtocolTypeRouter({
              "http": django_asgi_app,
              "websocket": AuthMiddlewareStack(
                  URLRouter(
                      websocket_urlpatterns
                  )
              ),
          })
          EOF
          
          # Create wsgi.py
          cat > wsgi.py << 'EOF'
          import os
          from django.core.wsgi import get_wsgi_application
          
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'chat_service.settings')
          
          application = get_wsgi_application()
          EOF
          
          # Go back to project root
          cd /app/chat_service
          
          # Create Django apps structure
          # Chat app
          mkdir -p chat
          cd chat
          touch __init__.py
          cat > models.py << 'APPEOF'
          from django.db import models
          from django.contrib.auth.models import User
          
          class BaseModel(models.Model):
              created_at = models.DateTimeField(auto_now_add=True)
              updated_at = models.DateTimeField(auto_now=True)
              
              class Meta:
                  abstract = True
          
          class ChatRoom(BaseModel):
              name = models.CharField(max_length=255)
              description = models.TextField(blank=True)
              is_active = models.BooleanField(default=True)
              
              def __str__(self):
                  return self.name
          
          class ChatMessage(BaseModel):
              room = models.ForeignKey(ChatRoom, on_delete=models.CASCADE, related_name='messages')
              user = models.ForeignKey(User, on_delete=models.CASCADE)
              message = models.TextField()
              is_deleted = models.BooleanField(default=False)
              
              class Meta:
                  ordering = ['-created_at']
          
              def __str__(self):
                  return f"{self.user.username}: {self.message[:50]}"
          APPEOF
          
          cat > admin.py << 'APPEOF'
          from django.contrib import admin
          from .models import ChatRoom, ChatMessage
          
          @admin.register(ChatRoom)
          class ChatRoomAdmin(admin.ModelAdmin):
              list_display = ['name', 'is_active', 'created_at']
              list_filter = ['is_active', 'created_at']
              search_fields = ['name', 'description']
          
          @admin.register(ChatMessage)
          class ChatMessageAdmin(admin.ModelAdmin):
              list_display = ['user', 'room', 'message', 'created_at', 'is_deleted']
              list_filter = ['room', 'is_deleted', 'created_at']
              search_fields = ['user__username', 'message', 'room__name']
          APPEOF
          
          cat > apps.py << 'APPEOF'
          from django.apps import AppConfig
          
          class ChatConfig(AppConfig):
              default_auto_field = 'django.db.models.BigAutoField'
              name = 'chat'
          APPEOF
          
          cat > urls.py << 'APPEOF'
          from django.urls import path
          from django.http import JsonResponse
          
          def chat_placeholder(request):
              return JsonResponse({
                  'message': 'Chat service is running', 
                  'status': 'active',
                  'features': ['Real-time messaging', 'Chat rooms', 'WebSocket support']
              })
          
          urlpatterns = [
              path('', chat_placeholder, name='chat-placeholder'),
          ]
          APPEOF
          
          cat > routing.py << 'APPEOF'
          from django.urls import re_path
          from . import consumers
          
          websocket_urlpatterns = [
              re_path(r'ws/chat/(?P<room_name>\w+)/$', consumers.ChatConsumer.as_asgi()),
          ]
          APPEOF
          
          cat > consumers.py << 'APPEOF'
          import json
          from channels.generic.websocket import AsyncWebsocketConsumer
          
          class ChatConsumer(AsyncWebsocketConsumer):
              async def connect(self):
                  self.room_name = self.scope['url_route']['kwargs']['room_name']
                  self.room_group_name = f'chat_{self.room_name}'
          
                  # Join room group
                  await self.channel_layer.group_add(
                      self.room_group_name,
                      self.channel_name
                  )
          
                  await self.accept()
          
              async def disconnect(self, close_code):
                  # Leave room group
                  await self.channel_layer.group_discard(
                      self.room_group_name,
                      self.channel_name
                  )
          
              # Receive message from WebSocket
              async def receive(self, text_data):
                  text_data_json = json.loads(text_data)
                  message = text_data_json['message']
          
                  # Send message to room group
                  await self.channel_layer.group_send(
                      self.room_group_name,
                      {
                          'type': 'chat_message',
                          'message': message
                      }
                  )
          
              # Receive message from room group
              async def chat_message(self, event):
                  message = event['message']
          
                  # Send message to WebSocket
                  await self.send(text_data=json.dumps({
                      'message': message
                  }))
          APPEOF
          
          cd ..
          
          # Notifications app
          mkdir -p notifications
          cd notifications
          touch __init__.py
          cat > models.py << 'APPEOF'
          from django.db import models
          from django.contrib.auth.models import User
          
          class BaseModel(models.Model):
              created_at = models.DateTimeField(auto_now_add=True)
              updated_at = models.DateTimeField(auto_now=True)
              
              class Meta:
                  abstract = True
          
          class Notification(BaseModel):
              user = models.ForeignKey(User, on_delete=models.CASCADE)
              title = models.CharField(max_length=200)
              message = models.TextField()
              is_read = models.BooleanField(default=False)
              notification_type = models.CharField(max_length=50, default='general')
              
              class Meta:
                  ordering = ['-created_at']
          
              def __str__(self):
                  return f"{self.user.username}: {self.title}"
          APPEOF
          
          cat > admin.py << 'APPEOF'
          from django.contrib import admin
          from .models import Notification
          
          @admin.register(Notification)
          class NotificationAdmin(admin.ModelAdmin):
              list_display = ['user', 'title', 'notification_type', 'is_read', 'created_at']
              list_filter = ['notification_type', 'is_read', 'created_at']
              search_fields = ['user__username', 'title', 'message']
          APPEOF
          
          cat > apps.py << 'APPEOF'
          from django.apps import AppConfig
          
          class NotificationsConfig(AppConfig):
              default_auto_field = 'django.db.models.BigAutoField'
              name = 'notifications'
          APPEOF
          
          cat > urls.py << 'APPEOF'
          from django.urls import path
          from django.http import JsonResponse
          
          def notifications_placeholder(request):
              return JsonResponse({
                  'message': 'Notifications service is running', 
                  'status': 'active',
                  'features': ['Push notifications', 'Real-time alerts', 'User notifications']
              })
          
          urlpatterns = [
              path('', notifications_placeholder, name='notifications-placeholder'),
          ]
          APPEOF
          
          cd ..
          
          # Run Django setup commands
          python manage.py migrate
          echo "from django.contrib.auth.models import User; User.objects.create_superuser('admin', 'admin@example.com', 'admin123') if not User.objects.filter(username='admin').exists() else None" | python manage.py shell
          python manage.py collectstatic --noinput
          
          # Start Django development server (using runserver for now since Redis isn't available)
          python manage.py runserver 0.0.0.0:8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: bidr
  labels:
    app: chat-service
spec:
  type: ClusterIP
  selector:
    app: chat-service
  ports:
  - port: 8002
    targetPort: 8000
    protocol: TCP
    name: http