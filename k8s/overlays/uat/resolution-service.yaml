apiVersion: apps/v1
kind: Deployment
metadata:
  name: resolution-service
  labels:
    app: resolution-service
    service: resolution
    version: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resolution-service
  template:
    metadata:
      labels:
        app: resolution-service
        service: resolution
        version: dev
    spec:
      serviceAccountName: bidr-service-account
      containers:
      - name: resolution-service
        image: bidrnparusdevregistry2024.azurecr.io/resolution-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: DEBUG
          value: "False"
        - name: DJANGO_SETTINGS_MODULE
          value: "resolution_service.settings"
        - name: SERVICE_NAME
          value: "resolution"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: bidr-secrets
              key: DJANGO_SECRET_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bidr-secrets
              key: RESOLUTION_DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: bidr-secrets
              key: REDIS_URL
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:8001"
        - name: TRANSACTION_SERVICE_URL
          value: "http://transactions-service:8006"
        - name: NOTIFICATION_SERVICE_URL
          value: "http://notifications-service:8005"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 5
      imagePullSecrets:
      - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: resolution-service
  labels:
    app: resolution-service
spec:
  type: LoadBalancer
  selector:
    app: resolution-service
  ports:
  - port: 8008
    targetPort: 8000
    protocol: TCP
    name: http
  loadBalancerSourceRanges:
  - 0.0.0.0/0
