apiVersion: v1
kind: Service
metadata:
  name: reviews-service
  namespace: bidr
  labels:
    app: reviews-service
spec:
  type: ClusterIP
  selector:
    app: reviews-service
  ports:
  - port: 8007
    targetPort: 8000
    protocol: TCP
    name: http