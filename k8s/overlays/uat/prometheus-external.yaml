apiVersion: v1
kind: Service
metadata:
  name: prometheus-external
  namespace: bidr-uat
  labels:
    app: prometheus
    service: prometheus-external
spec:
  type: LoadBalancer
  selector:
    app: prometheus
  ports:
    - name: http
      protocol: TCP
      port: 9090
      targetPort: 9090
  loadBalancerSourceRanges:
    - 0.0.0.0/0
