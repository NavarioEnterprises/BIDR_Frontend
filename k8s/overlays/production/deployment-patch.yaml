apiVersion: apps/v1
kind: Deployment
metadata:
  name: bidr-app
spec:
  template:
    spec:
      containers:
      - name: bidr-app
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        env:
        - name: DJANGO_ENV
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
