apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bidr-ingress
  namespace: bidr
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: bidr.local # Change this to your actual domain
    http:
      paths:
      # Authentication Service
      - path: /api/v1/auth/(.*)
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8000
      
      # Chat Service
      - path: /api/v1/chat/(.*)
        pathType: Prefix
        backend:
          service:
            name: chat-service
            port:
              number: 8000
      
      # Payment Service
      - path: /api/v1/payment/(.*)
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 8000
      
      # Resolution Service
      - path: /api/v1/resolution/(.*)
        pathType: Prefix
        backend:
          service:
            name: resolution-service
            port:
              number: 8000
      
      # Product Management Service
      - path: /api/v1/products/(.*)
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 8000
      
      # Notifications Service
      - path: /api/v1/notifications/(.*)
        pathType: Prefix
        backend:
          service:
            name: notifications-service
            port:
              number: 8000
      
      # Transactions Service
      - path: /api/v1/transactions/(.*)
        pathType: Prefix
        backend:
          service:
            name: transactions-service
            port:
              number: 8000
      
      # Reviews Service
      - path: /api/v1/reviews/(.*)
        pathType: Prefix
        backend:
          service:
            name: reviews-service
            port:
              number: 8000
      
      # Admin interfaces
      - path: /admin/auth/(.*)
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8000
      
      - path: /admin/chat/(.*)
        pathType: Prefix
        backend:
          service:
            name: chat-service
            port:
              number: 8000
      
      - path: /admin/payment/(.*)
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 8000
      
      - path: /admin/resolution/(.*)
        pathType: Prefix
        backend:
          service:
            name: resolution-service
            port:
              number: 8000
      
      - path: /admin/products/(.*)
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 8000
      
      - path: /admin/notifications/(.*)
        pathType: Prefix
        backend:
          service:
            name: notifications-service
            port:
              number: 8000
      
      - path: /admin/transactions/(.*)
        pathType: Prefix
        backend:
          service:
            name: transactions-service
            port:
              number: 8000
      
      - path: /admin/reviews/(.*)
        pathType: Prefix
        backend:
          service:
            name: reviews-service
            port:
              number: 8000
      
      # Health check endpoint - route to any service for load balancer health checks
      - path: /health/(.*)
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8000
      
      # Default route - API documentation or landing page
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8000

---
# LoadBalancer service for external access
apiVersion: v1
kind: Service
metadata:
  name: bidr-loadbalancer
  namespace: bidr
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-resource-group: "bidr-k8s"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 443
    targetPort: 443
    protocol: TCP
    name: https
  selector:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/component: controller
