---
# Auth Service (Development)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: bidr
  labels:
    app: auth-service
    service: authentication
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        service: authentication
    spec:
      containers:
      - name: auth-service
        image: python:3.11-slim
        ports:
        - containerPort: 8000
          name: http
        command: ["/bin/bash", "-c"]
        args:
          - |
            pip install django==4.2
            mkdir -p /app
            cd /app
            django-admin startproject authentication_service .
            echo "
            ALLOWED_HOSTS = ['*']
            DEBUG = True
            DATABASES = {
                'default': {
                    'ENGINE': 'django.db.backends.sqlite3',
                    'NAME': '/tmp/auth.sqlite3',
                }
            }
            " >> authentication_service/settings.py
            python manage.py migrate
            echo "from django.contrib.auth.models import User; User.objects.create_superuser('admin', 'admin@bidr.com', 'AdminPassword123!')" | python manage.py shell || true
            python manage.py runserver 0.0.0.0:8000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /admin/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: bidr
  labels:
    app: auth-service
spec:
  selector:
    app: auth-service
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP

---
# Chat Service (Development)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: bidr
  labels:
    app: chat-service
    service: chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
        service: chat
    spec:
      containers:
      - name: chat-service
        image: python:3.11-slim
        ports:
        - containerPort: 8000
          name: http
        command: ["/bin/bash", "-c"]
        args:
          - |
            pip install django==4.2
            mkdir -p /app
            cd /app
            django-admin startproject chat_service .
            echo "
            ALLOWED_HOSTS = ['*']
            DEBUG = True
            DATABASES = {
                'default': {
                    'ENGINE': 'django.db.backends.sqlite3',
                    'NAME': '/tmp/chat.sqlite3',
                }
            }
            FORCE_SCRIPT_NAME = '/chat'
            LOGIN_URL = '/chat/admin/login/'
            LOGIN_REDIRECT_URL = '/chat/admin/'
            LOGOUT_REDIRECT_URL = '/chat/admin/login/'
            " >> chat_service/settings.py
            python manage.py migrate
            echo "from django.contrib.auth.models import User; User.objects.create_superuser('admin', 'admin@example.com', 'AdminPassword123!')" | python manage.py shell || true
            python manage.py runserver 0.0.0.0:8000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /admin/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: bidr
  labels:
    app: chat-service
spec:
  selector:
    app: chat-service
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP

