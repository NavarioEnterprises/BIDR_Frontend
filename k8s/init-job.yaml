apiVersion: batch/v1
kind: Job
metadata:
  name: bidr-init
  namespace: bidr
spec:
  template:
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: bidr-init
        image: bidrcontainerregistry.azurecr.io/bidr-app:latest
        command: ["/bin/sh"]
        args:
        - -c
        - |
          echo "🚀 Starting BIDR Backend Initialization..."
          
          # Wait for database to be ready
          echo "⏳ Waiting for PostgreSQL to be ready..."
          until python -c "import psycopg2; psycopg2.connect(host='$DATABASE_HOST', port='$DATABASE_PORT', user='$DATABASE_USER', password='$DATABASE_PASSWORD', dbname='$DATABASE_NAME')" 2>/dev/null; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "✅ PostgreSQL is ready!"
          
          # Create migrations if needed
          echo "📝 Creating database migrations..."
          python manage.py makemigrations --noinput || echo "No new migrations needed"
          
          # Run migrations
          echo "🔄 Running database migrations..."
          python manage.py migrate --noinput
          
          # Collect static files
          echo "📁 Collecting static files..."
          python manage.py collectstatic --noinput --clear
          
          # Create superuser
          echo "👤 Creating superuser..."
          export DJANGO_SUPERUSER_EMAIL='admin@bidr.com'
          export DJANGO_SUPERUSER_PASSWORD='BIDRAdmin2025!'
          python manage.py createsuperuser --noinput --email admin@bidr.com || echo "User may already exist"
          
          echo "✅ Superuser created/updated successfully!"
          echo "🔑 Superuser credentials: admin@bidr.com:BIDRAdmin2025!"
          
          echo "✅ BIDR Backend initialization completed!"
          
        env:
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: bidr-config
              key: DEBUG
        - name: ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: bidr-config
              key: ALLOWED_HOSTS
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: bidr-secret
              key: DJANGO_SECRET_KEY
        - name: DATABASE_ENGINE
          valueFrom:
            configMapKeyRef:
              name: bidr-config
              key: DATABASE_ENGINE
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: bidr-config
              key: DATABASE_NAME
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: bidr-config
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: bidr-config
              key: DATABASE_PORT
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: bidr-secret
              key: DATABASE_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bidr-secret
              key: DATABASE_PASSWORD
        - name: EMAIL_HOST_USER
          valueFrom:
            secretKeyRef:
              name: bidr-secret
              key: EMAIL_HOST_USER
        - name: EMAIL_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bidr-secret
              key: EMAIL_HOST_PASSWORD
      restartPolicy: OnFailure
  backoffLimit: 3
