apiVersion: apps/v1
kind: Deployment
metadata:
  name: bidr-app
  namespace: bidr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bidr-app
  template:
    metadata:
      labels:
        app: bidr-app
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: bidr-app
        image: bidrcontainerregistry.azurecr.io/bidr-app:latest
        ports:
        - containerPort: 8067
        env:
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: bidr-config
              key: DEBUG
        - name: ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: bidr-config
              key: ALLOWED_HOSTS
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: bidr-secret
              key: DJANGO_SECRET_KEY
        - name: DATABASE_ENGINE
          valueFrom:
            configMapKeyRef:
              name: bidr-config
              key: DATABASE_ENGINE
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: bidr-config
              key: DATABASE_NAME
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: bidr-config
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: bidr-config
              key: DATABASE_PORT
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: bidr-secret
              key: DATABASE_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bidr-secret
              key: DATABASE_PASSWORD
        - name: EMAIL_HOST_USER
          valueFrom:
            secretKeyRef:
              name: bidr-secret
              key: EMAIL_HOST_USER
        - name: EMAIL_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bidr-secret
              key: EMAIL_HOST_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health/live/
            port: 8067
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready/
            port: 8067
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/
            port: 8067
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 30

---
apiVersion: v1
kind: Service
metadata:
  name: bidr-service
  namespace: bidr
spec:
  selector:
    app: bidr-app
  ports:
  - protocol: TCP
    port: 8067
    targetPort: 8067
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: bidr-service-lb
  namespace: bidr
spec:
  selector:
    app: bidr-app
  ports:
  - protocol: TCP
    port: 8067
    targetPort: 8067
  type: LoadBalancer
