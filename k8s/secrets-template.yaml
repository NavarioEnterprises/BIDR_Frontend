apiVersion: v1
kind: Secret
metadata:
  name: bidr-secrets
  namespace: bidr
type: Opaque
data:
  # All values must be base64 encoded
  # Use: echo -n "your-secret-value" | base64
  
  # Django Secret Key - Generate with: python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())'
  DJANGO_SECRET_KEY: ""
  
  # Database URLs - Format: postgresql://username:password@host:port/database_name
  AUTH_DATABASE_URL: ""
  CHAT_DATABASE_URL: ""
  PAYMENT_DATABASE_URL: ""
  PRODUCT_DATABASE_URL: ""
  NOTIFICATION_DATABASE_URL: ""
  TRANSACTION_DATABASE_URL: ""
  REVIEWS_DATABASE_URL: ""
  RESOLUTION_DATABASE_URL: ""
  
  # Redis URL - Format: redis://host:port/database_number
  REDIS_URL: ""
  
  # Email Configuration
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  
  # Payment Gateway Keys (Optional - for production)
  STRIPE_PUBLISHABLE_KEY: ""
  STRIPE_SECRET_KEY: ""
  
  # SMS Service Keys (Optional - for notifications)
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: acr-secret
  namespace: bidr
type: kubernetes.io/dockerconfigjson
data:
  # Docker registry credentials for Azure Container Registry
  # Use: kubectl create secret docker-registry acr-secret --namespace=bidr --docker-server=bidrnparusdevregistry2024.azurecr.io --docker-username=<username> --docker-password=<password> --dry-run=client -o yaml
  .dockerconfigjson: ""
