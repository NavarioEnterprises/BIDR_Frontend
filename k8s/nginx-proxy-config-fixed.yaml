apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-proxy-config
  namespace: default
data:
  default.conf: |
    # NGINX reverse proxy for BIDR services
    # Upstreams to internal ClusterIP services
    upstream auth_service {
        server auth-service.bidr.svc.cluster.local:8000;
    }
    upstream chat_service {
        server chat-service.bidr.svc.cluster.local:8000;
    }
    upstream payment_service {
        server payment-service.bidr.svc.cluster.local:8000;
    }
    upstream grafana_service {
        server grafana-service:3000;
    }
    upstream prometheus_service {
        server prometheus-service:9090;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Health
        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Auth service - includes Django admin redirects
        location /admin/ {
            proxy_pass http://auth_service/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect /admin/ /admin/;
        }

        # Chat service with admin panel
        location /chat/ {
            proxy_pass http://chat_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /chat;
            # Preserve redirect paths for Django admin
            proxy_redirect /admin/ /chat/admin/;
            proxy_redirect /accounts/ /chat/accounts/;
            proxy_redirect ~^/(.*)$ /chat/$1;
            # Fix any hardcoded admin URLs in the response
            sub_filter 'action="/admin/' 'action="/chat/admin/';
            sub_filter 'href="/admin/' 'href="/chat/admin/';
            sub_filter_once off;
        }

        # Payment service with admin panel
        location /payments/ {
            proxy_pass http://payment_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /payments;
            # Preserve redirect paths for Django admin
            proxy_redirect /admin/ /payments/admin/;
            proxy_redirect /accounts/ /payments/accounts/;
            proxy_redirect ~^/(.*)$ /payments/$1;
            # Fix any hardcoded admin URLs in the response
            sub_filter 'action="/admin/' 'action="/payments/admin/';
            sub_filter 'href="/admin/' 'href="/payments/admin/';
            sub_filter_once off;
        }

        # Grafana
        location /grafana/ {
            proxy_pass http://grafana_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Prometheus
        location /prometheus/ {
            proxy_pass http://prometheus_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default: send to auth
        location / {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
