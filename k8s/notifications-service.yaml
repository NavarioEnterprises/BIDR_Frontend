apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  namespace: bidr
  labels:
    app: notifications-service
    service: notifications
    version: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
        service: notifications
        version: dev
    spec:
      serviceAccountName: bidr-service-account
      containers:
      - name: notifications-service
        image: bidrnparusdevregistry2024.azurecr.io/notifications-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: DEBUG
          value: "True"
        - name: DJANGO_SETTINGS_MODULE
          value: "notifications_service.settings"
        - name: SERVICE_NAME
          value: "notifications"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: bidr-secrets
              key: DJANGO_SECRET_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bidr-secrets
              key: NOTIFICATION_DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: bidr-secrets
              key: REDIS_URL
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:8001"
        - name: EMAIL_HOST_USER
          valueFrom:
            secretKeyRef:
              name: bidr-secrets
              key: EMAIL_HOST_USER
        - name: EMAIL_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bidr-secrets
              key: EMAIL_HOST_PASSWORD
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: bidr-secrets
              key: TWILIO_ACCOUNT_SID
              optional: true
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: bidr-secrets
              key: TWILIO_AUTH_TOKEN
              optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /notifications/
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /notifications/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
      imagePullSecrets:
      - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  namespace: bidr
  labels:
    app: notifications-service
spec:
  type: LoadBalancer
  selector:
    app: notifications-service
  ports:
  - port: 8005
    targetPort: 8000
    protocol: TCP
    name: http
  loadBalancerSourceRanges:
  - 0.0.0.0/0
