apiVersion: v1
kind: ConfigMap
metadata:
  name: bidr-config
  namespace: bidr
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  DATABASE_ENGINE: "django.db.backends.postgresql"
  DATABASE_NAME: "bidr_db"
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  STATIC_URL: "/static/"
  MEDIA_URL: "/media/"
