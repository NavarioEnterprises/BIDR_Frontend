---
# Direct NodePort access to Chat Admin
apiVersion: v1
kind: Service
metadata:
  name: chat-admin-direct
  namespace: bidr
  labels:
    app: chat-admin-direct
spec:
  type: NodePort
  selector:
    app: chat-service
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30012
    name: http
---
# Direct NodePort access to Payment Admin
apiVersion: v1
kind: Service
metadata:
  name: payment-admin-direct
  namespace: bidr
  labels:
    app: payment-admin-direct
spec:
  type: NodePort
  selector:
    app: payment-service
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30013
    name: http
---
# NodePort for nginx proxy itself
apiVersion: v1
kind: Service
metadata:
  name: nginx-proxy-nodeport
  namespace: default
  labels:
    app: nginx-proxy-nodeport
spec:
  type: NodePort
  selector:
    app: nginx-proxy
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30001
    name: http
