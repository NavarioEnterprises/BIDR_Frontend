apiVersion: v1
kind: Secret
metadata:
  name: bidr-secret
  namespace: bidr
type: Opaque
data:
  # These are placeholders - in production, use Azure Key Vault CSI driver
  # or Azure Key Vault references in your deployment
  DJANGO_SECRET_KEY: # Will be populated from Key Vault
  DATABASE_USER: # Will be populated from Key Vault  
  DATABASE_PASSWORD: # Will be populated from Key Vault
  EMAIL_HOST_USER: # Will be populated from Key Vault
  EMAIL_HOST_PASSWORD: # Will be populated from Key Vault

---
# Azure Key Vault CSI Driver Secret Provider Class
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bidr-keyvault-secrets
  namespace: bidr
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityClientID: ""  # Will be populated by Terraform output
    keyvaultName: "bidr-keyvault"     # Update with your Key Vault name
    cloudName: ""
    objects: |
      array:
        - |
          objectName: django-secret-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: database-password
          objectType: secret
          objectVersion: ""
        - |
          objectName: database-user
          objectType: secret
          objectVersion: ""
    tenantId: ""  # Will be populated automatically
  secretObjects:
  - secretName: bidr-secret
    type: Opaque
    data:
    - objectName: django-secret-key
      key: DJANGO_SECRET_KEY
    - objectName: database-password
      key: DATABASE_PASSWORD
    - objectName: database-user
      key: DATABASE_USER
