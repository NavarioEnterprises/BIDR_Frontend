version: '3.9'

networks:
  bidr-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  static-volume:
  media-volume:

services:
  # Database Services
  postgres:
    image: postgres:15-alpine
    container_name: bidr-postgres
    restart: always
    platform: linux/arm64
    environment:
      POSTGRES_DB: bidr_db
      POSTGRES_USER: bidruser
      POSTGRES_PASSWORD: bidr_secure_password_2024
      POSTGRES_MULTIPLE_DATABASES: "auth_db,chat_db,payment_db,resolution_db,product_db,notifications_db,transactions_db,reviews_db"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    ports:
      - "5432:5432"
    networks:
      - bidr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidruser -d bidr_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: bidr-redis
    restart: always
    command: redis-server --appendonly yes --requirepass bidr_redis_password_2024
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - bidr-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "bidr_redis_password_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Authentication Service
  auth-service:
    build:
      context: ./authentication_service
      dockerfile: Dockerfile
    container_name: bidr-auth-service
    restart: always
    environment:
      - DEBUG=True
      - SECRET_KEY=your-super-secure-secret-key-here-change-in-production
      - DATABASE_URL=postgresql://bidruser:bidr_secure_password_2024@postgres:5432/auth_db
      - REDIS_URL=redis://:bidr_redis_password_2024@redis:6379/1
      - ALLOWED_HOSTS=localhost,127.0.0.1,auth-service,*.azurecontainer.io,*.azure.com
      - SECURE_SSL_REDIRECT=False
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USE_TLS=True
      - EMAIL_HOST_USER=your-email@gmail.com
      - EMAIL_HOST_PASSWORD=your-app-password
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bidr-network
    volumes:
      - static-volume:/app/staticfiles
      - media-volume:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Chat Service
  chat-service:
    build:
      context: ./chat_service
      dockerfile: Dockerfile
    container_name: bidr-chat-service
    restart: always
    environment:
      - DEBUG=False
      - SECRET_KEY=your-super-secure-secret-key-here-change-in-production
      - DATABASE_URL=postgresql://bidruser:bidr_secure_password_2024@postgres:5432/chat_db
      - REDIS_URL=redis://:bidr_redis_password_2024@redis:6379/2
      - ALLOWED_HOSTS=localhost,127.0.0.1,chat-service,*.azurecontainer.io,*.azure.com
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bidr-network
    volumes:
      - static-volume:/app/staticfiles
      - media-volume:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Payment Service  
  payment-service:
    build:
      context: ./payment_service
      dockerfile: Dockerfile
    container_name: bidr-payment-service
    restart: always
    environment:
      - DEBUG=False
      - SECRET_KEY=your-super-secure-secret-key-here-change-in-production
      - DATABASE_URL=postgresql://bidruser:bidr_secure_password_2024@postgres:5432/payment_db
      - REDIS_URL=redis://:bidr_redis_password_2024@redis:6379/3
      - ALLOWED_HOSTS=localhost,127.0.0.1,payment-service,*.azurecontainer.io,*.azure.com
      - PAYSTACK_SECRET_KEY=your-paystack-secret-key
      - PAYSTACK_PUBLIC_KEY=your-paystack-public-key
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bidr-network
    volumes:
      - static-volume:/app/staticfiles
      - media-volume:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Resolution Service
  resolution-service:
    build:
      context: ./resolution_service
      dockerfile: Dockerfile
    container_name: bidr-resolution-service
    restart: always
    environment:
      - DEBUG=False
      - SECRET_KEY=your-super-secure-secret-key-here-change-in-production
      - DATABASE_URL=postgresql://bidruser:bidr_secure_password_2024@postgres:5432/resolution_db
      - REDIS_URL=redis://:bidr_redis_password_2024@redis:6379/4
      - ALLOWED_HOSTS=localhost,127.0.0.1,resolution-service,*.azurecontainer.io,*.azure.com
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bidr-network
    volumes:
      - static-volume:/app/staticfiles
      - media-volume:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Product Management Service
  product-service:
    build:
      context: ./product_management_service
      dockerfile: Dockerfile.fixed
    container_name: bidr-product-service
    restart: always
    environment:
      - DEBUG=False
      - SECRET_KEY=your-super-secure-secret-key-here-change-in-production
      - DATABASE_URL=postgresql://bidruser:bidr_secure_password_2024@postgres:5432/product_db
      - REDIS_URL=redis://:bidr_redis_password_2024@redis:6379/5
      - ALLOWED_HOSTS=localhost,127.0.0.1,product-service,*.azurecontainer.io,*.azure.com
    ports:
      - "8005:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bidr-network
    volumes:
      - static-volume:/app/staticfiles
      - media-volume:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Notifications Service
  notifications-service:
    build:
      context: ./notifications_service
      dockerfile: Dockerfile
    container_name: bidr-notifications-service
    restart: always
    environment:
      - DEBUG=False
      - SECRET_KEY=your-super-secure-secret-key-here-change-in-production
      - DATABASE_URL=postgresql://bidruser:bidr_secure_password_2024@postgres:5432/notifications_db
      - REDIS_URL=redis://:bidr_redis_password_2024@redis:6379/6
      - ALLOWED_HOSTS=localhost,127.0.0.1,notifications-service,*.azurecontainer.io,*.azure.com
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USE_TLS=True
      - EMAIL_HOST_USER=your-email@gmail.com
      - EMAIL_HOST_PASSWORD=your-app-password
    ports:
      - "8006:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bidr-network
    volumes:
      - static-volume:/app/staticfiles
      - media-volume:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Transactions Service
  transactions-service:
    build:
      context: ./transactions_service
      dockerfile: Dockerfile
    container_name: bidr-transactions-service
    restart: always
    environment:
      - DEBUG=False
      - SECRET_KEY=your-super-secure-secret-key-here-change-in-production
      - DATABASE_URL=postgresql://bidruser:bidr_secure_password_2024@postgres:5432/transactions_db
      - REDIS_URL=redis://:bidr_redis_password_2024@redis:6379/7
      - ALLOWED_HOSTS=localhost,127.0.0.1,transactions-service,*.azurecontainer.io,*.azure.com
    ports:
      - "8007:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bidr-network
    volumes:
      - static-volume:/app/staticfiles
      - media-volume:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Reviews and Ratings Service
  reviews-service:
    build:
      context: ./reviews_and_ratings
      dockerfile: Dockerfile
    container_name: bidr-reviews-service
    restart: always
    environment:
      - DEBUG=False
      - SECRET_KEY=your-super-secure-secret-key-here-change-in-production
      - DATABASE_URL=postgresql://bidruser:bidr_secure_password_2024@postgres:5432/reviews_db
      - REDIS_URL=redis://:bidr_redis_password_2024@redis:6379/8
      - ALLOWED_HOSTS=localhost,127.0.0.1,reviews-service,*.azurecontainer.io,*.azure.com
    ports:
      - "8008:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bidr-network
    volumes:
      - static-volume:/app/staticfiles
      - media-volume:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: bidr-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static-volume:/var/www/static:ro
      - media-volume:/var/www/media:ro
    depends_on:
      - auth-service
      - chat-service
      - payment-service
      - resolution-service
      - product-service
      - notifications-service
      - transactions-service
      - reviews-service
    networks:
      - bidr-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: bidr-postgres-exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://bidruser:bidr_secure_password_2024@postgres:5432/bidr_db?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bidr-network

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: bidr-redis-exporter
    restart: always
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "bidr_redis_password_2024"
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bidr-network

  # Nginx Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: bidr-nginx-exporter
    restart: always
    command:
      - -nginx.scrape-uri=http://nginx:80/nginx_status
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    networks:
      - bidr-network

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: bidr-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - bidr-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  # Monitoring with Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: bidr-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=bidr_admin_password_2024
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - bidr-network
    depends_on:
      - prometheus
