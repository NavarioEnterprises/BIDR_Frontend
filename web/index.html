<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BIDR - An online marketplace platform that connects buyers and sellers.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BIDR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BIDR</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JavaScript API -->
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAegBp2UyTEJZnrmWBBPk0hU-C0bjR0cKA&libraries=places&callback=initGoogleMaps"></script>
  
  <!-- Google Places Helper -->
  <script>
    // Global callback function for Google Maps API
    function initGoogleMaps() {
      console.log('Google Maps API loaded via callback');
      // Load the helper script after Google Maps is ready
      const script = document.createElement('script');
      script.src = 'google_places_helper.js';
      script.onload = function() {
        console.log('Google Places helper loaded successfully');
      };
      script.onerror = function() {
        console.error('Failed to load Google Places helper');
      };
      document.head.appendChild(script);
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
